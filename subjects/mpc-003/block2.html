<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theories of Personality — Interactive Learning Builder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --bg2: #16161d;
    --bg3: #1e1e28;
    --bg4: #25252f;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #f0eff8;
    --text2: #a09fb8;
    --text3: #6b6a80;
    --accent1: #7c6bff;
    --accent1b: #5a49e0;
    --accent2: #ff6b9d;
    --accent3: #00d4aa;
    --accent4: #ffb547;
    --block1: #7c6bff;
    --block2: #ff6b9d;
    --block3: #00d4aa;
    --block4: #ffb547;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    text-align: center;
    padding: 3.5rem 2rem 2rem;
    position: relative;
  }
  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 260px;
    background: radial-gradient(ellipse 70% 200px at 50% -30px, rgba(124,107,255,0.18), transparent);
    pointer-events: none;
  }
  .header h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 400;
    letter-spacing: -0.5px;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #c4bdff 0%, #f0eff8 50%, #ffb3d0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    color: var(--text2);
    font-size: 1rem;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* BLOCKS GRID */
  .blocks-section { padding: 1rem 1.5rem 3rem; max-width: 1100px; margin: 0 auto; }
  .blocks-label {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 1rem;
  }
  .blocks-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (min-width: 700px) { .blocks-grid { grid-template-columns: repeat(4, 1fr); } }

  .block-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem 1.25rem 1.25rem;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .block-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 16px 16px 0 0;
    background: var(--block-color);
    opacity: 0.8;
  }
  .block-card:hover { border-color: var(--block-color); transform: translateY(-2px); background: var(--bg4); }
  .block-card.active { border-color: var(--block-color); background: var(--bg4); box-shadow: 0 0 0 1px var(--block-color), inset 0 0 30px rgba(0,0,0,0.2); }
  .block-num {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--block-color);
    margin-bottom: 0.5rem;
  }
  .block-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    font-weight: 400;
    line-height: 1.3;
    color: var(--text);
    margin-bottom: 0.4rem;
  }
  .block-subtitle { font-size: 0.78rem; color: var(--text2); font-weight: 300; line-height: 1.4; }
  .block-chapters { margin-top: 0.8rem; font-size: 0.72rem; color: var(--text3); }
  .block-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 0.75rem;
    background: color-mix(in srgb, var(--block-color) 15%, transparent);
    font-size: 1.1rem;
  }

  /* CONTENT PANEL */
  .content-panel {
    max-width: 1100px;
    margin: 0 auto 3rem;
    padding: 0 1.5rem;
    display: none;
  }
  .content-panel.visible { display: block; }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .panel-back {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 0.4rem 0.85rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 5px;
  }
  .panel-back:hover { border-color: var(--border2); color: var(--text); }
  .panel-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    font-weight: 400;
    color: var(--block-color-current);
  }
  .breadcrumb { font-size: 0.8rem; color: var(--text3); display: flex; align-items: center; gap: 6px; }
  .breadcrumb span { color: var(--text2); }

  /* CHAPTERS ROW */
  .chapters-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  @media (min-width: 600px) { .chapters-row { grid-template-columns: repeat(4, 1fr); } }

  .chapter-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .chapter-btn:hover { border-color: var(--border2); background: var(--bg4); }
  .chapter-btn.active { border-color: var(--block-color-current); background: var(--bg4); }
  .chapter-btn .ch-num {
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--block-color-current); margin-bottom: 0.35rem;
  }
  .chapter-btn .ch-name { font-size: 0.82rem; font-weight: 500; line-height: 1.35; color: var(--text); }

  /* CONCEPTS GRID */
  .concepts-section { display: none; }
  .concepts-section.visible { display: block; }
  .concepts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  .concept-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .concept-card:hover { border-color: var(--block-color-current); background: var(--bg4); transform: translateY(-1px); }
  .concept-card.active { border-color: var(--block-color-current); background: var(--bg4); }
  .concept-tag {
    display: inline-block;
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 4px;
    background: color-mix(in srgb, var(--block-color-current) 20%, transparent);
    color: var(--block-color-current);
    margin-bottom: 0.5rem;
  }
  .concept-title { font-size: 0.9rem; font-weight: 500; color: var(--text); line-height: 1.35; }
  .concept-preview { font-size: 0.78rem; color: var(--text2); margin-top: 0.3rem; line-height: 1.4; }

  /* DEEP DIVE */
  .deep-dive {
    display: none;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    margin-top: 0.5rem;
  }
  .deep-dive.visible { display: block; }
  .deep-dive-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem; margin-bottom: 1.5rem;
  }
  .deep-dive-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    font-weight: 400;
    color: var(--text);
    line-height: 1.25;
  }
  .close-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .close-btn:hover { background: var(--bg4); color: var(--text); }

  .concept-body {
    font-size: 0.92rem;
    line-height: 1.75;
    color: var(--text2);
    margin-bottom: 1.5rem;
  }
  .concept-body strong { color: var(--text); font-weight: 500; }
  .concept-body ul { margin: 0.75rem 0 0.75rem 1.2rem; }
  .concept-body li { margin-bottom: 0.4rem; }
  .concept-body .highlight {
    background: color-mix(in srgb, var(--block-color-current) 12%, transparent);
    border-left: 3px solid var(--block-color-current);
    padding: 0.75rem 1rem;
    border-radius: 0 8px 8px 0;
    margin: 1rem 0;
    font-style: italic;
    color: var(--text);
  }

  /* RECALL TOOLS */
  .recall-section { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
  .recall-label {
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text3); margin-bottom: 1rem;
  }
  .recall-tabs {
    display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap;
  }
  .recall-tab {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 0.38rem 0.85rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .recall-tab:hover { border-color: var(--border2); color: var(--text); }
  .recall-tab.active { background: color-mix(in srgb, var(--block-color-current) 20%, transparent); border-color: var(--block-color-current); color: var(--block-color-current); }

  .recall-content { display: none; }
  .recall-content.visible { display: block; }

  /* Flashcard */
  .flashcard {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    text-align: center;
    min-height: 180px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.75rem;
  }
  .flashcard:hover { border-color: var(--block-color-current); }
  .flashcard .q-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--block-color-current); }
  .flashcard .q-text { font-size: 1rem; font-weight: 500; color: var(--text); line-height: 1.5; max-width: 500px; }
  .flashcard .a-text { font-size: 0.88rem; color: var(--text2); line-height: 1.6; max-width: 500px; display: none; }
  .flashcard.flipped .a-text { display: block; }
  .flashcard.flipped .q-label { color: var(--accent3); }
  .flashcard.flipped .q-label::after { content: ' — Answer'; }
  .flashcard-hint { font-size: 0.75rem; color: var(--text3); text-align: center; margin-top: 0.5rem; }
  .card-nav { display: flex; align-items: center; gap: 1rem; justify-content: center; margin-top: 1rem; }
  .card-nav button {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); padding: 0.4rem 1rem; border-radius: 8px;
    cursor: pointer; font-size: 0.82rem; transition: all 0.2s;
  }
  .card-nav button:hover { border-color: var(--border2); color: var(--text); }
  .card-counter { font-size: 0.78rem; color: var(--text3); }

  /* Quiz */
  .quiz-q { font-size: 0.95rem; font-weight: 500; color: var(--text); margin-bottom: 1rem; line-height: 1.5; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
  .quiz-option {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); padding: 0.7rem 1rem; border-radius: 10px;
    cursor: pointer; font-size: 0.88rem; transition: all 0.2s; text-align: left;
  }
  .quiz-option:hover { border-color: var(--border2); color: var(--text); }
  .quiz-option.correct { border-color: var(--accent3); background: color-mix(in srgb, var(--accent3) 12%, transparent); color: var(--accent3); }
  .quiz-option.wrong { border-color: #ff5566; background: color-mix(in srgb, #ff5566 12%, transparent); color: #ff8898; }
  .quiz-feedback { font-size: 0.85rem; line-height: 1.5; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
  .quiz-feedback.visible { display: block; }
  .quiz-feedback.good { background: color-mix(in srgb, var(--accent3) 12%, transparent); color: var(--accent3); }
  .quiz-feedback.bad { background: color-mix(in srgb, #ff5566 12%, transparent); color: #ff8898; }
  .quiz-next {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); padding: 0.5rem 1.25rem; border-radius: 8px;
    cursor: pointer; font-size: 0.85rem; transition: all 0.2s; display: none;
  }
  .quiz-next.visible { display: inline-flex; align-items: center; gap: 6px; }
  .quiz-next:hover { border-color: var(--border2); color: var(--text); }

  /* Summary */
  .summary-box {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.25rem 1.5rem;
    font-size: 0.88rem; line-height: 1.75; color: var(--text2);
  }
  .summary-box h3 { font-size: 0.9rem; font-weight: 500; color: var(--text); margin-bottom: 0.5rem; }
  .summary-box ul { margin-left: 1.1rem; margin-top: 0.5rem; }
  .summary-box li { margin-bottom: 0.35rem; }
  .key-terms { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1rem; }
  .key-term {
    background: color-mix(in srgb, var(--block-color-current) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--block-color-current) 30%, transparent);
    color: var(--block-color-current);
    font-size: 0.75rem; padding: 4px 12px; border-radius: 6px; font-weight: 500;
  }

  /* Analogy */
  .analogy-card {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.5rem;
  }
  .analogy-card .analogy-icon { font-size: 2rem; margin-bottom: 0.75rem; }
  .analogy-card h3 { font-size: 0.95rem; font-weight: 500; color: var(--text); margin-bottom: 0.5rem; }
  .analogy-card p { font-size: 0.88rem; color: var(--text2); line-height: 1.7; }

  /* Progress dots */
  .progress-bar { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; margin-top: 1.5rem; }
  .p-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: all 0.3s; }
  .p-dot.done { background: var(--block-color-current); }

  /* Visited tracking */
  .concept-card .visited-badge {
    float: right;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--block-color-current);
    opacity: 0;
    transition: opacity 0.3s;
    margin-top: 3px;
  }
  .concept-card.visited .visited-badge { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>Theories of Personality</h1>
  <p>Four blocks · Four units each · Deep dive into every concept</p>
</div>

<div class="blocks-section">
  <div class="blocks-label">Choose a block to begin</div>
  <div class="blocks-grid" id="blocksGrid"></div>
</div>

<div class="content-panel" id="contentPanel">
  <div class="panel-header">
    <button class="panel-back" onclick="goBack()">← Back</button>
    <div>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="panel-title" id="panelTitle"></div>
    </div>
  </div>
  <div class="chapters-row" id="chaptersRow"></div>
  <div class="concepts-section" id="conceptsSection">
    <div class="concepts-grid" id="conceptsGrid"></div>
    <div class="deep-dive" id="deepDive">
      <div class="deep-dive-header">
        <div class="deep-dive-title" id="diveTitle"></div>
        <button class="close-btn" onclick="closeDive()">✕</button>
      </div>
      <div class="concept-body" id="diveBody"></div>
      <div class="recall-section">
        <div class="recall-label">Recall & Practice</div>
        <div class="recall-tabs">
          <div class="recall-tab active" onclick="switchRecall('flashcard', this)">Flashcard</div>
          <div class="recall-tab" onclick="switchRecall('quiz', this)">Quick Quiz</div>
          <div class="recall-tab" onclick="switchRecall('summary', this)">Summary</div>
          <div class="recall-tab" onclick="switchRecall('analogy', this)">Analogy</div>
        </div>
        <div class="recall-content visible" id="flashcard-content"></div>
        <div class="recall-content" id="quiz-content"></div>
        <div class="recall-content" id="summary-content"></div>
        <div class="recall-content" id="analogy-content"></div>
      </div>
    </div>
  </div>
</div>

<script>
const BLOCKS = [
  {
    id: 1,
    color: '#7c6bff',
    icon: '🧠',
    title: 'Psychodynamic Theory',
    subtitle: 'Freud, Horney & Sullivan',
    tag: 'Block 1',
    units: [
      {
        name: 'Freud\'s Psychoanalytic Theory',
        short: 'Freud',
        concepts: [
          {
            title: 'Structure of Personality: Id, Ego & Superego',
            tag: 'Structural Model',
            preview: 'Three regions of the mind in constant conflict',
            body: `<p>Freud proposed that personality consists of three regions or structures, each representing different aspects of our mental life.</p>
            <div class="highlight">"Parts of the unconscious mind are in constant conflict with the conscious part of the mind."</div>
            <p><strong>The Id</strong> is present from birth and is totally unconscious. It operates on the <strong>pleasure principle</strong> — demanding immediate satisfaction of primitive needs, sexual desires, and aggressive impulses without regard for reality or consequences. It is the raw, instinctual core of personality.</p>
            <p><strong>The Ego</strong> develops out of the id as we learn about reality. It operates on the <strong>reality principle</strong> — it involves perception, reasoning, and learning to interact effectively with the world. The ego tries to maximise pleasure while minimising pain within realistic constraints.</p>
            <p><strong>The Superego</strong> develops as children are exposed to their parents' moral values. It contains two aspects:</p>
            <ul>
              <li><strong>Ego-ideal:</strong> The standard of ideal behaviour</li>
              <li><strong>Conscience:</strong> The sense of right and wrong</li>
            </ul>
            <p>The superego represents societal demands and creates feelings of guilt when we fall short of norms. These three structures are in constant dynamic tension — what we desire (id), what is possible (ego), and what is moral (superego).</p>`,
            flashcards: [
              { q: 'What principle does the Id operate on?', a: 'The pleasure principle — seeking immediate gratification of primitive needs without regard for reality or consequences.' },
              { q: 'What does the Superego contain?', a: 'Two parts: the Ego-ideal (standards of ideal behaviour) and the Conscience (sense of right and wrong internalized from parents).' },
              { q: 'How does the Ego differ from the Id?', a: 'The Ego operates on the reality principle and mediates between Id\'s desires and the demands of the real world, unlike the Id which demands immediate satisfaction.' }
            ],
            quiz: [
              { q: 'Which structure of personality is present at birth and completely unconscious?', opts: ['Ego', 'Superego', 'Id', 'Preconscious'], ans: 2, exp: 'The Id is present from birth, is totally unconscious, and operates on the pleasure principle.' },
              { q: 'What principle does the Ego operate on?', opts: ['Pleasure principle', 'Reality principle', 'Moral principle', 'Survival principle'], ans: 1, exp: 'The Ego operates on the reality principle — it deals with what is actually possible in the real world.' },
              { q: 'Which structure internalizes parental moral values?', opts: ['Id', 'Ego', 'Superego', 'Libido'], ans: 2, exp: 'The Superego develops as children absorb their parents\' moral values, creating the ego-ideal and conscience.' }
            ],
            summary: { points: ['Id = pleasure principle, unconscious, primitive', 'Ego = reality principle, mediator, develops from Id', 'Superego = morality, ego-ideal + conscience, parental values'], terms: ['Id', 'Ego', 'Superego', 'Pleasure Principle', 'Reality Principle', 'Conscience'] },
            analogy: { icon: '⚖️', title: 'A courtroom', text: 'Think of personality as a courtroom. The Id is the defendant who wants everything NOW. The Ego is the judge trying to make a fair, realistic ruling. The Superego is the strict moral prosecutor who never lets anything slide. Every decision is the result of this constant three-way negotiation.' }
          },
          {
            title: 'States of Consciousness: Conscious, Preconscious & Unconscious',
            tag: 'Topographical Model',
            preview: 'The iceberg of the mind — what lies below the surface',
            body: `<p>Freud's topographical model describes three levels of mental functioning, often compared to an iceberg.</p>
            <div class="highlight">"Only 10% of an iceberg is visible (conscious) whereas the other 90% is beneath the water."</div>
            <p><strong>The Conscious</strong> is what you are currently aware of — your immediate experiences. It is small, fleeting, and limited. Right now, you are consciously reading these words.</p>
            <p><strong>The Preconscious</strong> holds memories not currently active but retrievable with effort — like what you had for breakfast today. You weren't thinking about it until asked, yet you can bring it to mind. It bridges conscious and unconscious.</p>
            <p><strong>The Unconscious</strong> is the vast, inaccessible reservoir of repressed memories, forbidden desires, and threatening impulses — material that was either never conscious or was pushed out due to anxiety. It contains:</p>
            <ul>
              <li>Hostile feelings too threatening to acknowledge</li>
              <li>Sexual cravings and desperate fears</li>
              <li>Material that leaks out in dreams, slips of the tongue, and neurotic symptoms</li>
            </ul>
            <p>Material flows relatively easily between conscious and preconscious, but truly unconscious material requires psychoanalysis to surface.</p>`,
            flashcards: [
              { q: 'What does the preconscious contain?', a: 'Stored memories not currently active in awareness but that can be brought to consciousness with effort — like recalling what you ate yesterday.' },
              { q: 'Why can\'t we access the unconscious directly?', a: 'It contains material so anxiety-provoking that it has been repressed. We need psychoanalysis to bring it to conscious awareness.' },
              { q: 'What percentage of the mind is conscious, according to Freud\'s iceberg metaphor?', a: 'Only about 10% is conscious. The preconscious is 10-15%, and the unconscious makes up 75-80% — the bulk of the iceberg.' }
            ],
            quiz: [
              { q: 'Which level contains repressed desires that cannot be voluntarily accessed?', opts: ['Conscious', 'Preconscious', 'Unconscious', 'Subconscious'], ans: 2, exp: 'The unconscious contains repressed memories and desires inaccessible without psychoanalysis.' },

            tag: 'Dynamics',
            preview: 'How the ego protects us from anxiety',
            body: `<p>When the id desires something the ego and superego reject, anxiety results. The ego deploys <strong>defense mechanisms</strong> — unconscious strategies to reduce this anxiety. Freud identified several key ones:</p>
            <ul>
              <li><strong>Repression:</strong> Banishing threatening memories or desires from consciousness entirely. The original defense mechanism — the foundation of all others.</li>
              <li><strong>Denial:</strong> Refusing to accept reality (e.g., "I did not fail my exam"). Often involves daydreaming about how things could have been different.</li>
              <li><strong>Projection:</strong> Attributing your own unacceptable impulses to someone else (e.g., an unfaithful person suspecting their partner of cheating).</li>
              <li><strong>Reaction Formation:</strong> Doing or thinking the opposite of what you feel (e.g., being excessively kind to someone you're angry at). Hallmark: excessive behaviour.</li>
              <li><strong>Displacement:</strong> Moving an impulse from its true target to a safer one (e.g., angry at your boss, you go home and yell at your family).</li>
              <li><strong>Sublimation:</strong> Channelling unacceptable impulses into socially productive activities. Freud considered this the most adaptive defense — e.g., turning aggression into athletic achievement.</li>
              <li><strong>Rationalisation:</strong> Finding a logical excuse for behaviour you regret (e.g., "The exam was badly written, that's why I failed").</li>
              <li><strong>Regression:</strong> Returning to an earlier stage of development under stress — an adult who becomes clingy or throws tantrums when overwhelmed.</li>
              <li><strong>Intellectualisation:</strong> Turning emotional pain into abstract thought (e.g., obsessively researching a disease rather than grieving a diagnosis).</li>

function openBlock(blockIdx) {
  currentBlock = blockIdx;
  currentUnit = null;
  currentConcept = null;
  setBlockColorVar(blockColors[blockIdx]);

  const panel = document.getElementById('contentPanel');
  const title = document.getElementById('panelTitle');
  const breadcrumb = document.getElementById('breadcrumb');
  const chaptersRow = document.getElementById('chaptersRow');
  const conceptsSection = document.getElementById('conceptsSection');
  const deepDive = document.getElementById('deepDive');

  const blockData = ['Psychodynamic Theory','Social Cognitive Theory','Learning Theory','Humanistic & Self Theory'];
  title.textContent = blockData[blockIdx];
  breadcrumb.innerHTML = `<span>Block ${blockIdx+1}</span>`;
  conceptsSection.classList.remove('visible');
  deepDive.classList.remove('visible');

  const block = BLOCKS[blockIdx];
  chaptersRow.innerHTML = block.units.map((u, i) => `
    <div class="chapter-btn" onclick="openUnit(${i})" id="chBtn-${i}">
      <div class="ch-num">Unit ${i+1}</div>
      <div class="ch-name">${u.name}</div>
    </div>
  `).join('');

  panel.classList.add('visible');
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function openUnit(unitIdx) {
  currentUnit = unitIdx;
  currentConcept = null;

  document.querySelectorAll('.chapter-btn').forEach((b,i) => {
    b.classList.toggle('active', i === unitIdx);
  });

  const block = BLOCKS[currentBlock];
  const unit = block.units[unitIdx];

  const conceptsSection = document.getElementById('conceptsSection');
  const conceptsGrid = document.getElementById('conceptsGrid');
  const deepDive = document.getElementById('deepDive');

  conceptsGrid.innerHTML = unit.concepts.map((c, i) => {
    const key = `${currentBlock}-${unitIdx}-${i}`;
    const isVisited = visitedConcepts[key];
    return `
    <div class="concept-card ${isVisited ? 'visited' : ''}" id="conceptCard-${i}" onclick="openConcept(${i})">
      <div class="visited-badge"></div>
      <div class="concept-tag">${c.tag}</div>
      <div class="concept-title">${c.title}</div>
      <div class="concept-preview">${c.preview}</div>
    </div>
  `;}).join('');

  conceptsSection.classList.add('visible');
  deepDive.classList.remove('visible');
}

function openConcept(conceptIdx) {
  currentConcept = conceptIdx;
  const key = `${currentBlock}-${currentUnit}-${conceptIdx}`;
  visitedConcepts[key] = true;

  document.querySelectorAll('.concept-card').forEach((c,i) => {
    c.classList.toggle('active', i === conceptIdx);
    if (i === conceptIdx) c.classList.add('visited');
  });

  const unit = BLOCKS[currentBlock].units[currentUnit];
  const concept = unit.concepts[conceptIdx];

  document.getElementById('diveTitle').textContent = concept.title;
  document.getElementById('diveBody').innerHTML = concept.body;

  currentFlashcardIdx = 0;
  currentFlashcardFlipped = false;
  currentQuizIdx = 0;
  currentQuizAnswered = false;

  renderFlashcard(concept);
  renderQuiz(concept, 0);
  renderSummary(concept);
  renderAnalogy(concept);

  document.querySelectorAll('.recall-tab').forEach((t,i) => t.classList.toggle('active', i===0));
  document.querySelectorAll('.recall-content').forEach((c,i) => c.classList.toggle('visible', i===0));

  const deepDive = document.getElementById('deepDive');
  deepDive.classList.add('visible');
  deepDive.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderFlashcard(concept) {
  const el = document.getElementById('flashcard-content');
  const total = concept.flashcards.length;
  const idx = currentFlashcardIdx;
  const card = concept.flashcards[idx];
  el.innerHTML = `
    <div class="flashcard" id="fc" onclick="flipCard()">
      <div class="q-label">Question ${idx+1} of ${total}</div>
      <div class="q-text">${card.q}</div>
      <div class="a-text">${card.a}</div>
    </div>
    <div class="flashcard-hint">Click to reveal answer</div>
    <div class="card-nav">
      <button onclick="prevCard(event)">← Prev</button>
      <span class="card-counter">${idx+1} / ${total}</span>
      <button onclick="nextCard(event)">Next →</button>
    </div>
  `;
  currentFlashcardFlipped = false;
}

function flipCard() {
  const fc = document.getElementById('fc');
  if (fc) {
    fc.classList.toggle('flipped');
    currentFlashcardFlipped = !currentFlashcardFlipped;
    fc.nextElementSibling.textContent = currentFlashcardFlipped ? 'Click to hide answer' : 'Click to reveal answer';
  }
}

function nextCard(e) {
  e.stopPropagation();
  const concept = BLOCKS[currentBlock].units[currentUnit].concepts[currentConcept];
  currentFlashcardIdx = (currentFlashcardIdx + 1) % concept.flashcards.length;
  renderFlashcard(concept);
}

function prevCard(e) {
  e.stopPropagation();
  const concept = BLOCKS[currentBlock].units[currentUnit].concepts[currentConcept];
  currentFlashcardIdx = (currentFlashcardIdx - 1 + concept.flashcards.length) % concept.flashcards.length;
  renderFlashcard(concept);
}

function renderQuiz(concept, idx) {
  const el = document.getElementById('quiz-content');
  if (!concept.quiz || concept.quiz.length === 0) { el.innerHTML = '<p style="color:var(--text2)">No quiz available.</p>'; return; }
  const total = concept.quiz.length;
  const q = concept.quiz[idx];
  el.innerHTML = `
    <div class="quiz-q">Q${idx+1} of ${total}: ${q.q}</div>
    <div class="quiz-options">
      ${q.opts.map((o,i) => `<button class="quiz-option" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
    </div>
    <div class="quiz-feedback" id="qFeedback"></div>
    <button class="quiz-next" id="qNext" onclick="nextQuiz()">Next question →</button>
  `;
  currentQuizAnswered = false;
}

function answerQuiz(chosen) {
  if (currentQuizAnswered) return;
  currentQuizAnswered = true;
  const concept = BLOCKS[currentBlock].units[currentUnit].concepts[currentConcept];
  const q = concept.quiz[currentQuizIdx];
  const opts = document.querySelectorAll('.quiz-option');
  opts[chosen].classList.add(chosen === q.ans ? 'correct' : 'wrong');
  if (chosen !== q.ans) opts[q.ans].classList.add('correct');
  const fb = document.getElementById('qFeedback');
  fb.className = `quiz-feedback visible ${chosen === q.ans ? 'good' : 'bad'}`;
  fb.textContent = (chosen === q.ans ? '✓ Correct! ' : '✗ Not quite. ') + q.exp;
  const nxt = document.getElementById('qNext');
  if (nxt) nxt.classList.add('visible');
}

function nextQuiz() {
  const concept = BLOCKS[currentBlock].units[currentUnit].concepts[currentConcept];
  currentQuizIdx = (currentQuizIdx + 1) % concept.quiz.length;
  renderQuiz(concept, currentQuizIdx);
}

function renderSummary(concept) {
  const el = document.getElementById('summary-content');
  const s = concept.summary;
  el.innerHTML = `
    <div class="summary-box">
      <h3>Key Points</h3>
      <ul>${s.points.map(p => `<li>${p}</li>`).join('')}</ul>
      <div style="margin-top:1rem;font-size:0.78rem;color:var(--text3);font-weight:500;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:0.5rem;">Key Terms</div>
      <div class="key-terms">${s.terms.map(t => `<span class="key-term">${t}</span>`).join('')}</div>
    </div>
  `;
}

function renderAnalogy(concept) {
  const el = document.getElementById('analogy-content');
  const a = concept.analogy;
  el.innerHTML = `
    <div class="analogy-card">
      <div class="analogy-icon">${a.icon}</div>
      <h3>Think of it like: ${a.title}</h3>
      <p>${a.text}</p>
    </div>
  `;
}

function switchRecall(type, tab) {
  document.querySelectorAll('.recall-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('.recall-content').forEach(c => c.classList.remove('visible'));
  document.getElementById(`${type}-content`).classList.add('visible');
}

function closeDive() {
  document.getElementById('deepDive').classList.remove('visible');
  document.querySelectorAll('.concept-card').forEach(c => c.classList.remove('active'));
  currentConcept = null;
}

function goBack() {
  if (currentUnit !== null) {
    currentUnit = null;
    currentConcept = null;
    document.getElementById('conceptsSection').classList.remove('visible');
    document.getElementById('deepDive').classList.remove('visible');
    document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
  } else {
    document.getElementById('contentPanel').classList.remove('visible');
    currentBlock = null;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

renderBlocks();
</script>
</body>
</html>
