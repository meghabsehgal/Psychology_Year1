<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adulthood & Ageing — Interactive Learning Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=Fira+Mono:wght@400;500&display=swap');

  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --cream: #ede8da;
    --gold: #c9a84c;
    --gold-light: #e8d5a3;
    --rust: #c0533a;
    --sage: #5a7a6a;
    --muted: #7a7060;
    --b1: #2d4a6e; --b1l: #e8f0f8; --b1a: #4a7aaa;
    --b2: #6e2d4a; --b2l: #f8e8f0; --b2a: #aa4a7a;
    --b3: #2d6e4a; --b3l: #e8f8f0; --b3a: #4aaa7a;
    --b4: #6e4a2d; --b4l: #f8f0e8; --b4a: #aa7a4a;
    --shadow: rgba(26,26,46,0.12);
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .site-header {
    background: var(--ink);
    color: var(--paper);
    padding: 28px 40px 24px;
    position: relative;
    overflow: hidden;
  }
  .site-header::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent, transparent 20px,
      rgba(201,168,76,0.06) 20px, rgba(201,168,76,0.06) 40px
    );
  }
  .header-inner { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }
  .header-eyebrow {
    font-family: 'Fira Mono', monospace;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 8px;
  }
  .header-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 5vw, 48px);
    line-height: 1.1;
    color: var(--paper);
  }
  .header-title em { color: var(--gold); font-style: italic; }
  .header-sub {
    margin-top: 8px;
    font-size: 14px; color: rgba(245,240,232,0.6);
    font-weight: 300;
  }
  .header-nav {
    margin-top: 20px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .nav-btn {
    padding: 6px 14px; border-radius: 20px; border: 1.5px solid;
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all .2s; font-family: 'DM Sans', sans-serif;
    background: transparent;
  }
  .nav-btn:hover { transform: translateY(-1px); }

  /* BLOCKS GRID */
  .blocks-section { max-width: 1100px; margin: 0 auto; padding: 36px 24px; }
  .section-label {
    font-family: 'Fira Mono', monospace;
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px;
  }
  .blocks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
  }

  .block-card {
    border-radius: var(--radius);
    padding: 22px;
    cursor: pointer;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
    position: relative;
    overflow: hidden;
    border: 2px solid transparent;
    user-select: none;
  }
  .block-card::before {
    content: '';
    position: absolute; top: 0; right: 0;
    width: 80px; height: 80px;
    border-radius: 0 0 0 80px;
    opacity: .12;
  }
  .block-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 40px var(--shadow); }
  .block-card.active { border-color: currentColor; box-shadow: 0 8px 32px var(--shadow); transform: translateY(-2px); }

  .b1-card { background: var(--b1l); color: var(--b1); }
  .b1-card::before { background: var(--b1); }
  .b2-card { background: var(--b2l); color: var(--b2); }
  .b2-card::before { background: var(--b2); }
  .b3-card { background: var(--b3l); color: var(--b3); }
  .b3-card::before { background: var(--b3); }
  .b4-card { background: var(--b4l); color: var(--b4); }
  .b4-card::before { background: var(--b4); }

  .block-num {
    font-family: 'DM Serif Display', serif;
    font-size: 40px; line-height: 1; opacity: .18; margin-bottom: 8px;
  }
  .block-title {
    font-family: 'DM Serif Display', serif;
    font-size: 17px; line-height: 1.3; margin-bottom: 6px;
  }
  .block-desc { font-size: 12px; opacity: .7; font-weight: 300; line-height: 1.5; }
  .block-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,.5); border-radius: 20px;
    padding: 3px 10px; font-size: 11px; font-weight: 500;
    margin-top: 12px;
  }
  .block-pill::before { content: '▶'; font-size: 8px; }

  /* UNIT PANEL */
  .unit-panel {
    max-width: 1100px; margin: 0 auto; padding: 0 24px 36px;
    display: none;
    animation: slideIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  .unit-panel.visible { display: block; }
  @keyframes slideIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

  .units-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .units-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
  }
  .close-btn {
    background: var(--cream); border: none; cursor: pointer;
    width: 32px; height: 32px; border-radius: 50%;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    transition: all .2s; color: var(--ink);
  }
  .close-btn:hover { background: var(--ink); color: var(--paper); }

  .units-tabs {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .unit-tab {
    padding: 8px 18px; border-radius: 20px; border: 1.5px solid var(--cream);
    background: white; cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all .2s; color: var(--ink);
  }
  .unit-tab:hover { border-color: currentColor; }
  .unit-tab.active { color: white; border-color: transparent; }

  /* CONTENT AREA */
  .content-area {
    background: white; border-radius: var(--radius);
    padding: 28px; box-shadow: 0 4px 24px var(--shadow);
    display: none;
  }
  .content-area.visible { display: block; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .content-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--cream);
    margin-bottom: 20px;
    gap: 12px;
  }
  .content-title {
    font-family: 'DM Serif Display', serif;
    font-size: 20px; line-height: 1.3;
    flex: 1;
  }
  .content-badge {
    font-family: 'Fira Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    padding: 4px 10px; border-radius: 4px;
    white-space: nowrap; font-weight: 500;
  }

  /* TOPICS LIST */
  .topics-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }
  .topic-item {
    border-radius: 8px; padding: 12px 14px;
    cursor: pointer; transition: all .2s;
    border: 1.5px solid var(--cream);
    display: flex; align-items: flex-start; gap: 10px;
    background: #fafafa;
  }
  .topic-item:hover { border-color: currentColor; background: white; transform: translateX(2px); }
  .topic-item.active { background: white; border-color: currentColor; box-shadow: 0 2px 12px var(--shadow); }
  .topic-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .topic-name { font-size: 13px; font-weight: 500; line-height: 1.4; }
  .topic-sub { font-size: 11px; opacity: .6; margin-top: 2px; }

  /* DEEP DIVE */
  .deep-dive {
    border-top: 1px solid var(--cream); margin-top: 16px; padding-top: 20px;
    display: none;
  }
  .deep-dive.visible { display: block; animation: fadeIn .3s ease; }

  .deep-title {
    font-family: 'DM Serif Display', serif;
    font-size: 17px; margin-bottom: 4px;
  }
  .deep-breadcrumb {
    font-size: 11px; color: var(--muted); margin-bottom: 16px;
    font-family: 'Fira Mono', monospace;
  }
  .deep-content {
    font-size: 14px; line-height: 1.75; color: #333;
    background: var(--paper); border-radius: 8px; padding: 16px;
    margin-bottom: 16px;
  }
  .deep-content p { margin-bottom: 10px; }
  .deep-content p:last-child { margin-bottom: 0; }
  .deep-content strong { color: var(--ink); font-weight: 600; }

  /* STUDY TOOLS */
  .study-tools {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
  }
  .tool-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px; border: 1.5px solid var(--cream);
    background: white; cursor: pointer; font-size: 12px; font-weight: 500;
    transition: all .2s; color: var(--ink); font-family: 'DM Sans', sans-serif;
  }
  .tool-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow); }
  .tool-btn .icon { font-size: 14px; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(26,26,46,.6); backdrop-filter: blur(4px);
    z-index: 1000; display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: 16px;
    max-width: 600px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    box-shadow: 0 24px 64px rgba(0,0,0,.25);
    animation: modalIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalIn { from { opacity:0; transform:scale(.9); } to { opacity:1; transform:scale(1); } }
  .modal-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--cream);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: white; z-index: 1;
    border-radius: 16px 16px 0 0;
  }
  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
  }
  .modal-body { padding: 24px; }
  .modal-close {
    background: var(--cream); border: none; cursor: pointer;
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .modal-close:hover { background: var(--ink); color: white; }

  /* FLASHCARD */
  .flashcard-scene { perspective: 1000px; height: 200px; cursor: pointer; margin-bottom: 16px; }
  .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .6s; }
  .flashcard.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .card-front { background: var(--ink); color: var(--paper); }
  .card-back { background: var(--gold-light); color: var(--ink); transform: rotateY(180deg); }
  .card-face .label { font-size: 10px; letter-spacing: 2px; opacity: .5; margin-bottom: 10px; font-family:'Fira Mono',monospace; }
  .card-face .question { font-size: 16px; font-weight: 600; line-height: 1.4; font-family:'DM Serif Display',serif; }
  .card-face .answer { font-size: 13px; line-height: 1.6; }
  .card-nav { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .card-nav button {
    padding: 8px 20px; border-radius: 20px; border: 1.5px solid var(--cream);
    background: white; cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all .2s; font-family:'DM Sans',sans-serif;
  }
  .card-nav button:hover { background: var(--ink); color: white; border-color: var(--ink); }
  .card-counter { font-size: 12px; color: var(--muted); font-family:'Fira Mono',monospace; }

  /* QUIZ */
  .quiz-q { font-family:'DM Serif Display',serif; font-size: 17px; line-height: 1.4; margin-bottom: 16px; }
  .quiz-opts { display: flex; flex-direction: column; gap: 8px; }
  .quiz-opt {
    padding: 12px 16px; border-radius: 8px; border: 1.5px solid var(--cream);
    cursor: pointer; font-size: 13px; transition: all .2s;
    background: white;
  }
  .quiz-opt:hover:not(.locked) { border-color: var(--gold); background: var(--gold-light); }
  .quiz-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; }
  .quiz-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
  .quiz-feedback {
    margin-top: 14px; padding: 12px; border-radius: 8px;
    font-size: 13px; line-height: 1.5; display: none;
    background: var(--cream);
  }
  .quiz-feedback.visible { display: block; }
  .quiz-nav { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
  .quiz-nav button {
    padding: 8px 20px; border-radius: 8px; border: none;
    background: var(--ink); color: white; cursor: pointer;
    font-size: 13px; font-weight: 500; font-family:'DM Sans',sans-serif;
    transition: all .2s;
  }
  .quiz-nav button:hover { opacity: .85; }

  /* MIND MAP */
  .mindmap-wrap { overflow-x: auto; }
  .mindmap-wrap svg { max-width: 100%; }

  /* SUMMARY */
  .summary-list { list-style: none; }
  .summary-list li {
    padding: 10px 0; border-bottom: 1px solid var(--cream);
    font-size: 13px; line-height: 1.6;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .summary-list li::before { content: '→'; color: var(--gold); flex-shrink: 0; margin-top: 1px; }

  /* PROGRESS */
  .progress-bar-wrap { background: var(--cream); border-radius: 4px; height: 6px; margin-bottom: 6px; }
  .progress-bar-fill { height: 6px; border-radius: 4px; transition: width .6s ease; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .site-header { padding: 20px 18px; }
    .blocks-section, .unit-panel { padding-left: 14px; padding-right: 14px; }
    .topics-grid { grid-template-columns: 1fr; }
    .content-area { padding: 18px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-eyebrow">Interactive Learning Explorer</div>
    <h1 class="header-title">Adulthood &amp; <em>Ageing</em></h1>
    <p class="header-sub">4 Blocks · 4 Units each · Click any block to explore concepts, flashcards, quizzes &amp; mind maps</p>
    <div class="header-nav" id="headerNav"></div>
  </div>
</header>

<!-- BLOCKS -->
<section class="blocks-section">
  <div class="section-label">Select a block to begin</div>
  <div class="blocks-grid" id="blocksGrid"></div>
</section>

<!-- UNIT PANEL -->
<section class="unit-panel" id="unitPanel">
  <div class="units-header">
    <h2 class="units-title" id="panelTitle"></h2>
    <button class="close-btn" onclick="closePanel()">✕</button>
  </div>
  <div class="units-tabs" id="unitsTabs"></div>
  <div class="content-area" id="contentArea">
    <div class="content-header">
      <h3 class="content-title" id="contentTitle"></h3>
      <span class="content-badge" id="contentBadge"></span>
    </div>
    <div id="topicsGrid" class="topics-grid"></div>
    <div class="deep-dive" id="deepDive">
      <div class="deep-breadcrumb" id="deepBreadcrumb"></div>
      <h4 class="deep-title" id="deepTitle"></h4>
      <div class="deep-content" id="deepContent"></div>
      <div class="study-tools" id="studyTools"></div>
    </div>
  </div>
</section>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ============================================================
// DATA
// ============================================================
const BLOCKS = [
  {
    id: 1, cls: 'b1', label: 'Block 1',
    title: 'Physical Changes',
    desc: 'Body transformations across the lifespan — early adulthood through old age',
    units: [
      {
        id: 'u1', num: 'Unit 1', label: 'Physical Changes',
        sub: 'Early Adulthood · Middle Age · Old Age',
        topics: [
          {
            icon: '🌱', name: 'Early Adulthood (20–40)', sub: 'Growth, peak performance',
            content: `<p><strong>Early adulthood</strong> spans ages 20–40, a time of vibrant health and peak physical performance. The body continues to undergo hormonal changes — beards thicken, voices deepen, and women complete breast development.</p>
            <p><strong>Height:</strong> Females reach adult height by 18; most males by 21. However, muscles continue gaining mass, especially in males. Both genders add about <strong>15 pounds</strong> of body fat during this transition.</p>
            <p><strong>Key milestone:</strong> Emerging adulthood (18–25) — individuals leave childhood dependency but have not yet assumed full adult responsibilities. Financial and emotional independence are core developmental tasks.</p>
            <p><strong>Erikson's lens:</strong> This stage is characterised by the crisis of <em>Intimacy vs. Isolation</em> — the capacity to form deep intimate relationships. Failure leads to social and emotional isolation.</p>`,
            flashcards: [
              { q: 'At what age do females typically reach adult height?', a: 'By age 18. Most males reach adult height by age 21, though some continue growing into early 20s.' },
              { q: 'What is "emerging adulthood"?', a: 'The age period from 18–25 years; individuals have left childhood dependency but not yet assumed full adult responsibilities.' },
              { q: 'What is Erikson\'s crisis in early adulthood?', a: 'Intimacy vs. Isolation — developing the ability to form deep, intimate relationships with others.' },
              { q: 'Average weight gain during early adulthood?', a: 'About 15 pounds for both men and women.' },
            ],
            quiz: [
              { q: 'Which physical change is typical of early adulthood?', opts: ['Hair turns grey', 'Muscles continue to gain mass', 'Bone density decreases sharply', 'Skin elasticity is lost'], ans: 1, exp: 'Muscles continue gaining mass — especially in males — during early adulthood, even after height is achieved.' },
              { q: 'What are the two typical crisis conditions in early adulthood?', opts: ['Retirement and widowhood', 'Unemployment and marital discord', 'Osteoporosis and arthritis', 'Depression and dementia'], ans: 1, exp: 'Unemployment and marital discord are two typical crisis conditions cited in early adulthood.' },
            ]
          },
          {
            icon: '⚖️', name: 'Middle Adulthood (40–60)', sub: 'Visible ageing, functional changes',
            content: `<p><strong>Middle adulthood</strong> spans ages 40–60 and is characterised by competence, maturity, responsibility and stability. It is also a period of creativity — the best works of scientists, writers and artists are often produced in the late forties and early fifties.</p>
            <p><strong>Most noticeable physical change:</strong> Loss of elasticity in the skin, especially the face, resulting in lines and wrinkles. Most individuals also get slightly shorter over time.</p>
            <p><strong>Vision:</strong> Around the 40s, near vision declines — a condition called <strong>presbyopia</strong>. Reading glasses or bifocals may be required. Sensitivity to glare also increases.</p>
            <p><strong>Menopause</strong> occurs in women between ages 45–50, involving hormonal changes and loss of reproductive ability. Both genders may experience grey/thinning hair. Men gain weight abdominally; women in hips and thighs. Strength and flexibility wane in both.</p>`,
            flashcards: [
              { q: 'What is presbyopia?', a: 'A decline in near vision occurring in the 40s, where the lens becomes less elastic. Reading glasses or bifocals are often needed.' },
              { q: 'At what ages does menopause typically occur?', a: 'Between ages 45 and 50, involving hormonal changes and loss of reproductive ability.' },
              { q: 'Where do men vs. women typically gain weight in middle adulthood?', a: 'Men gain weight in the abdominal region; women gain in the hips and thighs.' },
              { q: 'What is Erikson\'s crisis in middle adulthood?', a: 'Generativity vs. Self-Absorption — making meaningful contributions to future generations vs. becoming preoccupied with selfish needs.' },
            ],
            quiz: [
              { q: 'What is the most noticeable skin change in middle adulthood?', opts: ['Acne', 'Loss of elasticity causing wrinkles', 'Increased oil production', 'Darkening of skin tone'], ans: 1, exp: 'Loss of skin elasticity, especially in the face, causing lines and wrinkles, is one of the first visible signs of ageing.' },
              { q: 'Presbyopia refers to...', opts: ['Hearing loss', 'Memory decline', 'Decline in near vision', 'Bone density loss'], ans: 2, exp: 'Presbyopia is a decline in near vision as the lens of the eye becomes less elastic, common in the 40s.' },
            ]
          },
          {
            icon: '🌿', name: 'Old Age (65+)', sub: 'Sensory, skeletal & systemic changes',
            content: `<p><strong>Old age</strong> begins at approximately 65 and is marked by cumulative biological changes. The key insight: <em>chronological age has little bearing on biological age</em> — lifestyle habits profoundly shape individual variation.</p>
            <p><strong>External changes:</strong> Hair turns distinctly grey/white and may thin; skin becomes less elastic, more wrinkled, dry and thin (partly from loss of fatty tissue underneath).</p>
            <p><strong>Sensory changes:</strong> About 30% of people over 60 have hearing impairment; ~50% over 85 have hearing loss. Vision changes include reduced peripheral vision, slower adaptation to light changes, and increased risk of cataracts and macular degeneration.</p>
            <p><strong>Cardiovascular:</strong> Heart muscle becomes more rigid; arteries stiffen. Less oxygen is delivered during activity. <strong>Immune system</strong> declines as T-cells become less effective.</p>
            <p><strong>Falls risk:</strong> 30% of those over 65 and 40% of those over 80 have fallen within the past year. Hip fractures carry a 12–20% increase in mortality.</p>`,
            flashcards: [
              { q: 'What percentage of people over 85 have hearing loss?', a: 'About 50% of people over 85 have hearing loss.' },
              { q: 'What is functional age?', a: 'The actual competence and performance a person displays, regardless of chronological age.' },
              { q: 'What causes macular degeneration?', a: 'Breakdown of light-sensitive cells in the macula (central retina), causing blurry central vision. A diet high in anti-oxidants can delay it.' },
              { q: 'What percentage of those over 65 have fallen in the past year?', a: 'About 30%, rising to 40% for those over 80. Serious injury occurs about 10% of the time.' },
            ],
            quiz: [
              { q: 'What is the primary fall-related fracture in elderly people?', opts: ['Wrist fracture', 'Spinal fracture', 'Hip fracture', 'Shoulder fracture'], ans: 2, exp: 'Hip fractures are the most common serious injury from falls in the elderly, associated with a 12–20% increase in mortality.' },
              { q: 'Which immune cells become less effective with ageing?', opts: ['B cells', 'T cells', 'Stem cells', 'Red blood cells'], ans: 1, exp: 'The immune system declines as T cells become less effective, making elders more susceptible to infections and autoimmune conditions.' },
            ]
          },
          {
            icon: '🦴', name: 'Arthritis, Diabetes & Injuries', sub: 'Common physical disabilities',
            content: `<p><strong>Arthritis</strong> is a condition of inflamed, painful, stiff or swollen joints. Two forms:</p>

            flashcards: [
              { q: 'What cancer accounts for the most deaths in late adulthood?', a: 'Lung cancer accounts for more deaths than breast cancer, prostate cancer, and colon cancer combined.' },
              { q: 'What is glaucoma known as?', a: '"The sneak thief of sight" — the first symptom is vision loss, which cannot be restored once lost, though the disease can be arrested.' },
              { q: 'Why does depression often go undetected in old age?', a: 'Many people mistakenly believe depression is a natural condition of old age, so it is often underdiagnosed and untreated.' },
            ],
            quiz: [
              { q: 'Arthritis affects approximately what proportion of the elderly population?', opts: ['One-quarter', 'One-third', 'Nearly half', 'Two-thirds'], ans: 2, exp: 'Arthritis affects nearly half the elderly population and is a leading cause of disability.' },
              { q: 'What triggers increased suicide and depression rates in late adulthood?', opts: ['Chronic pain', 'Retirement', 'Loss of friends', 'Hospitalisation'], ans: 1, exp: 'Retirement is a major life change — many people have their sense of worth tied to work, and depression and suicide rates rise upon retirement.' },
            ]
          }
        ]
      }
    ]
  }
];

// ============================================================
// STATE
// ============================================================
let activeBlock = null;
let activeUnit = null;
let activeTopic = null;
let modalMode = null;
let quizIdx = 0;
let quizAnswered = false;
let fcIdx = 0;
let fcFlipped = false;

// ============================================================
// INIT
// ============================================================
function init() {
  renderBlocks();
  renderHeaderNav();
}

function renderHeaderNav() {
  const nav = document.getElementById('headerNav');
  const colors = ['#2d4a6e','#6e2d4a','#2d6e4a','#6e4a2d'];
  BLOCKS.forEach((b, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.style.borderColor = colors[i];
    btn.style.color = colors[i];
    btn.textContent = `Block ${b.id}: ${b.title}`;
    btn.onclick = () => openBlock(b.id);
    nav.appendChild(btn);
  });
}

function renderBlocks() {
  const grid = document.getElementById('blocksGrid');
  grid.innerHTML = '';
  BLOCKS.forEach(b => {
    const card = document.createElement('div');
    card.className = `block-card b${b.id}-card`;
    card.id = `block-${b.id}`;
    card.innerHTML = `
      <div class="block-num">${String(b.id).padStart(2,'0')}</div>
      <div class="block-title">${b.title}</div>
      <div class="block-desc">${b.desc}</div>
      <div class="block-pill">Explore ${b.units.length} unit${b.units.length>1?'s':''}</div>
    `;
    card.onclick = () => openBlock(b.id);
    grid.appendChild(card);
  });
}

// ============================================================
// BLOCK & UNIT NAVIGATION
// ============================================================
function openBlock(id) {
  activeBlock = BLOCKS.find(b => b.id === id);
  activeUnit = activeBlock.units[0];
  activeTopic = null;

  // highlight card
  document.querySelectorAll('.block-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById(`block-${id}`);
  if (card) { card.classList.add('active'); card.scrollIntoView({ behavior:'smooth', block:'nearest' }); }

  renderUnitPanel();
  document.getElementById('unitPanel').classList.add('visible');
  document.getElementById('unitPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closePanel() {
  document.getElementById('unitPanel').classList.remove('visible');
  document.querySelectorAll('.block-card').forEach(c => c.classList.remove('active'));
  activeBlock = null; activeUnit = null; activeTopic = null;
}

function renderUnitPanel() {
  const block = activeBlock;
  document.getElementById('panelTitle').textContent = `Block ${block.id}: ${block.title}`;

  const tabs = document.getElementById('unitsTabs');
  tabs.innerHTML = '';
  const clr = `var(--b${block.id})`;
  block.units.forEach(u => {
    const tab = document.createElement('button');
    tab.className = 'unit-tab' + (u.id === activeUnit.id ? ' active' : '');
    tab.textContent = `${u.num}: ${u.label}`;
    if (u.id === activeUnit.id) { tab.style.background = clr; }
    tab.onclick = () => { activeUnit = u; activeTopic = null; renderUnitPanel(); };
    tabs.appendChild(tab);
  });

  renderUnitContent();
}

function renderUnitContent() {
  const u = activeUnit;
  const block = activeBlock;
  const clr = `var(--b${block.id})`;
  const clrL = `var(--b${block.id}l)`;

  document.getElementById('contentTitle').textContent = `${u.num}: ${u.label}`;
  const badge = document.getElementById('contentBadge');
  badge.textContent = u.sub;
  badge.style.background = clrL;
  badge.style.color = `var(--b${block.id})`;

  const grid = document.getElementById('topicsGrid');
  grid.innerHTML = '';
  u.topics.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 'topic-item' + (activeTopic === i ? ' active' : '');
    item.style.color = clr;
    item.innerHTML = `
      <span class="topic-icon">${t.icon}</span>
      <div>
        <div class="topic-name">${t.name}</div>
        <div class="topic-sub">${t.sub}</div>
      </div>
    `;
    item.onclick = () => openTopic(i);
    grid.appendChild(item);
  });

  const deepDiv = document.getElementById('deepDive');
  if (activeTopic !== null) {
    renderDeepDive(activeTopic);
    deepDiv.classList.add('visible');
  } else {
    deepDiv.classList.remove('visible');
  }

  document.getElementById('contentArea').classList.add('visible');
}

function openTopic(i) {
  activeTopic = i;
  renderUnitContent();
  document.getElementById('deepDive').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function renderDeepDive(i) {
  const t = activeUnit.topics[i];
  const block = activeBlock;
  const clr = `var(--b${block.id})`;

  document.getElementById('deepBreadcrumb').textContent = `Block ${block.id} → ${activeUnit.num} → ${t.name}`;
  document.getElementById('deepTitle').textContent = t.name;
  document.getElementById('deepContent').innerHTML = t.content;

  const tools = document.getElementById('studyTools');
  tools.innerHTML = '';
  const toolDefs = [
    { icon: '🃏', label: 'Flashcards', mode: 'flashcard' },
    { icon: '✏️', label: 'Quiz Me', mode: 'quiz' },
    { icon: '🗺️', label: 'Mind Map', mode: 'mindmap' },
    { icon: '📝', label: 'Key Takeaways', mode: 'summary' },
  ];
  toolDefs.forEach(td => {
    const btn = document.createElement('button');
    btn.className = 'tool-btn';
    btn.style.borderColor = clr;
    btn.innerHTML = `<span class="icon">${td.icon}</span>${td.label}`;
    btn.onclick = () => openModal(td.mode, i);
    tools.appendChild(btn);
  });
}

// ============================================================
// MODAL
// ============================================================
function openModal(mode, topicIdx) {
  modalMode = mode;
  const t = activeUnit.topics[topicIdx];
  const modal = document.getElementById('modal');
  const overlay = document.getElementById('modalOverlay');
  const clr = `var(--b${activeBlock.id})`;

  let titleMap = { flashcard:'🃏 Flashcards', quiz:'✏️ Quiz', mindmap:'🗺️ Mind Map', summary:'📝 Key Takeaways' };
  document.getElementById('modalTitle').textContent = `${titleMap[mode]} — ${t.name}`;

  let body = '';
  if (mode === 'flashcard') { fcIdx = 0; fcFlipped = false; body = renderFlashcardHTML(t, clr); }
  else if (mode === 'quiz') { quizIdx = 0; quizAnswered = false; body = renderQuizHTML(t, clr); }
  else if (mode === 'mindmap') { body = renderMindmapHTML(t, clr); }
  else if (mode === 'summary') { body = renderSummaryHTML(t, clr); }

  document.getElementById('modalBody').innerHTML = body;
  overlay.classList.add('open');

  if (mode === 'flashcard') attachFlashcardEvents(t, clr);
  if (mode === 'quiz') attachQuizEvents(t, clr);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// ============================================================
// FLASHCARDS
// ============================================================
function renderFlashcardHTML(t, clr) {
  const cards = t.flashcards;
  const pct = Math.round(((fcIdx+1)/cards.length)*100);
  return `
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:12px;color:#888;font-family:'Fira Mono',monospace">Card ${fcIdx+1} of ${cards.length}</span>
        <span style="font-size:12px;color:${clr};font-weight:600">${pct}% complete</span>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;background:${clr}"></div></div>
    </div>
    <div class="flashcard-scene" onclick="flipCard()">
      <div class="flashcard" id="fcCard">
        <div class="card-face card-front">
          <div class="label">TAP TO FLIP · QUESTION</div>
          <div class="question">${cards[fcIdx].q}</div>
        </div>
        <div class="card-face card-back">
          <div class="label">ANSWER</div>
          <div class="answer">${cards[fcIdx].a}</div>
        </div>
      </div>
    </div>
    <div class="card-nav">
      <button onclick="prevCard()" ${fcIdx===0?'disabled':''}>← Prev</button>
      <span class="card-counter">${fcIdx+1} / ${cards.length}</span>
      <button onclick="nextCard()" ${fcIdx===cards.length-1?'disabled':''}>Next →</button>
    </div>
  `;
}
function attachFlashcardEvents(t, clr) {}
function flipCard() {
  fcFlipped = !fcFlipped;
  const card = document.getElementById('fcCard');
  if (card) card.classList.toggle('flipped', fcFlipped);
}
function nextCard() {
  const t = activeUnit.topics[activeTopic];
  if (fcIdx < t.flashcards.length - 1) { fcIdx++; fcFlipped = false; }
  document.getElementById('modalBody').innerHTML = renderFlashcardHTML(t, `var(--b${activeBlock.id})`);
}
function prevCard() {
  const t = activeUnit.topics[activeTopic];
  if (fcIdx > 0) { fcIdx--; fcFlipped = false; }
  document.getElementById('modalBody').innerHTML = renderFlashcardHTML(t, `var(--b${activeBlock.id})`);
}

// ============================================================
// QUIZ
// ============================================================
function renderQuizHTML(t, clr) {
  const q = t.quiz[quizIdx];
  const total = t.quiz.length;
  const pct = Math.round(((quizIdx)/total)*100);
  return `
    <div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:12px;color:#888;font-family:'Fira Mono',monospace">Question ${quizIdx+1} of ${total}</span>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;background:${clr}"></div></div>
    </div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts" id="quizOpts">
      ${q.opts.map((o,i) => `<div class="quiz-opt" data-idx="${i}" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}
    </div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <div class="quiz-nav">
      ${quizIdx < total-1 ? `<button id="nextQBtn" onclick="nextQuestion()" style="display:none">Next Question →</button>` : `<button id="nextQBtn" onclick="finishQuiz()" style="display:none">See Results 🎉</button>`}
    </div>
  `;
}
function attachQuizEvents(t, clr) {}
function answerQuiz(selected) {
  if (quizAnswered) return;
  quizAnswered = true;
  const t = activeUnit.topics[activeTopic];
  const q = t.quiz[quizIdx];
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(o => { o.classList.add('locked'); o.style.cursor='default'; });
  opts[selected].classList.add(selected === q.ans ? 'correct' : 'wrong');
  if (selected !== q.ans) opts[q.ans].classList.add('correct');
  const fb = document.getElementById('quizFeedback');
  fb.innerHTML = `<strong>${selected===q.ans?'✅ Correct!':'❌ Not quite.'}</strong> ${q.exp}`;
  fb.classList.add('visible');
  const btn = document.getElementById('nextQBtn');
  if (btn) btn.style.display = 'block';
}
function nextQuestion() {
  quizIdx++; quizAnswered = false;
  const t = activeUnit.topics[activeTopic];
  document.getElementById('modalBody').innerHTML = renderQuizHTML(t, `var(--b${activeBlock.id})`);
}
function finishQuiz() {
  document.getElementById('modalBody').innerHTML = `
    <div style="text-align:center;padding:24px 0">
      <div style="font-size:48px;margin-bottom:12px">🎉</div>
      <div style="font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:8px">Quiz Complete!</div>
      <div style="font-size:14px;color:#666;margin-bottom:24px">Great work reviewing this topic.</div>
      <button onclick="resetQuiz()" style="padding:10px 24px;border-radius:8px;border:none;background:var(--ink);color:white;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500">Retake Quiz ↺</button>
    </div>
  `;
}
function resetQuiz() {
  quizIdx = 0; quizAnswered = false;
  const t = activeUnit.topics[activeTopic];
  document.getElementById('modalBody').innerHTML = renderQuizHTML(t, `var(--b${activeBlock.id})`);
}

// ============================================================
// MIND MAP
// ============================================================
function renderMindmapHTML(t, clr) {
  const clrRgb = clr.replace('var(--b','').replace(')','');
  const hexMap = {'1':'#2d4a6e','2':'#6e2d4a','3':'#2d6e4a','4':'#6e4a2d'};
  const hex = hexMap[activeBlock.id] || '#333';
  const lighter = hex + '22';

  // extract key points from flashcard q's
  const pts = t.flashcards.map(f => f.q.replace(/\?/g,'').substring(0,38) + (f.q.length>38?'…':''));
  const angles = pts.map((_, i) => (i / pts.length) * 2 * Math.PI - Math.PI/2);
  const cx = 250, cy = 160, r = 100;

  const nodes = pts.map((p, i) => ({
    x: cx + r * Math.cos(angles[i]),
    y: cy + r * Math.sin(angles[i]),
    label: p
  }));

  const lines = nodes.map(n => `<line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="${hex}" stroke-width="1.5" stroke-dasharray="4,3" opacity=".5"/>`).join('');
  const circles = nodes.map(n => {
    const words = n.label.split(' ');
    const lines2 = [];
    let cur = '';
    words.forEach(w => {
      if ((cur+' '+w).trim().length > 16) { lines2.push(cur.trim()); cur = w; }
      else cur = (cur+' '+w).trim();
    });
    if (cur) lines2.push(cur);
    const textEls = lines2.map((l,li) => `<text x="${n.x}" y="${n.y - (lines2.length-1)*7 + li*14}" text-anchor="middle" font-size="9" fill="${hex}" font-family="DM Sans,sans-serif" font-weight="500">${l}</text>`).join('');
    return `<circle cx="${n.x}" cy="${n.y}" r="34" fill="${lighter}" stroke="${hex}" stroke-width="1.5"/>` + textEls;
  }).join('');

  return `
    <p style="font-size:12px;color:#888;margin-bottom:12px;font-family:'Fira Mono',monospace">Key concepts in ${t.name}</p>
    <div class="mindmap-wrap">
      <svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:12px;background:${lighter}">
        ${lines}
        <circle cx="${cx}" cy="${cy}" r="52" fill="${hex}"/>
        <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="11" fill="white" font-family="DM Serif Display,serif" font-weight="bold">
          ${t.name.split(' ').slice(0,2).join(' ')}
        </text>
        <text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.8)" font-family="DM Sans,sans-serif">
          ${t.name.split(' ').slice(2).join(' ')}
        </text>
        ${circles}
      </svg>
    </div>
    <p style="font-size:11px;color:#aaa;margin-top:10px;text-align:center">Nodes represent key questions from this topic's flashcards</p>
  `;
}

// ============================================================
// SUMMARY
// ============================================================
function renderSummaryHTML(t, clr) {
  const hex = {'1':'#2d4a6e','2':'#6e2d4a','3':'#2d6e4a','4':'#6e4a2d'}[activeBlock.id];
  const items = t.flashcards.map(f => `<li><span>${f.q}<br><em style="color:${hex};font-style:normal">${f.a}</em></span></li>`).join('');
  return `
    <p style="font-size:13px;color:#666;margin-bottom:16px">Core concepts from <strong>${t.name}</strong></p>
    <ul class="summary-list">${items}</ul>
    <div style="margin-top:20px;padding:14px;background:var(--paper);border-radius:8px;font-size:13px;color:#555;line-height:1.6">
      <strong style="color:${hex}">💡 Remember:</strong> ${t.sub}. Review these key Q&A pairs regularly using spaced repetition for best retention.
    </div>
  `;
}

// ============================================================
// START
// ============================================================
init();
</script>
</body>
</html>
