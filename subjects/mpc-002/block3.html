
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block 3 – Development During Adolescence | Interactive Quiz Builder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0e0c1a;
    --surface: #16132a;
    --card: #1e1a35;
    --border: #2e2850;
    --accent: #c084fc;
    --accent2: #f472b6;
    --accent3: #38bdf8;
    --text: #e8e3f5;
    --muted: #8b7faa;
    --correct: #4ade80;
    --wrong: #f87171;
    --gold: #fbbf24;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === BACKGROUND === */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(192,132,252,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 80% 80%, rgba(56,189,248,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 60% 40%, rgba(244,114,182,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  /* === LAYOUT === */
  .app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* === HEADER === */
  .header { text-align: center; margin-bottom: 3rem; }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, rgba(192,132,252,0.2), rgba(244,114,182,0.15));
    border: 1px solid rgba(192,132,252,0.3);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.35rem 1rem;
    border-radius: 999px;
    margin-bottom: 1.2rem;
  }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.15;
    background: linear-gradient(135deg, #e8e3f5 30%, var(--accent) 80%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.7rem;
  }
  .subtitle { color: var(--muted); font-size: 1rem; font-weight: 300; }

  /* === TABS === */
  .tabs {
    display: flex; gap: 0.5rem; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem; padding-bottom: 0;
  }
  .tab {
    background: none; border: none; cursor: pointer;
    padding: 0.65rem 1.2rem;
    border-radius: var(--radius) var(--radius) 0 0;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; font-weight: 500;
    color: var(--muted);
    border: 1px solid transparent;
    border-bottom: none;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    background: var(--card);
    border-color: var(--border);
    border-bottom: 2px solid var(--card);
    margin-bottom: -1px;
  }

  /* === UNIT SELECTOR === */
  .unit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .unit-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2rem;
    cursor: pointer;
    transition: all 0.25s;
    position: relative; overflow: hidden;
  }
  .unit-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0; transition: opacity 0.25s;
  }
  .unit-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .unit-card:hover::before { opacity: 1; }
  .unit-card.selected { border-color: var(--accent); background: rgba(192,132,252,0.1); }
  .unit-card.selected::before { opacity: 1; }
  .unit-num { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.4rem; }
  .unit-title { font-family: 'DM Serif Display', serif; font-size: 1rem; line-height: 1.3; color: var(--text); }
  .unit-count { margin-top: 0.6rem; font-size: 0.8rem; color: var(--muted); }

  /* === CONTROLS === */
  .controls { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 2rem; }
  .control-group { display: flex; flex-direction: column; gap: 0.35rem; flex: 1; min-width: 140px; }
  .control-group label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  select, input[type=number] {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 0.9rem;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    appearance: none;
    cursor: pointer;
    width: 100%;
    transition: border-color 0.2s;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); }

  /* === BUTTONS === */
  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.7rem 1.5rem;
    border-radius: 999px;
    border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem; font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 4px 20px rgba(192,132,252,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(192,132,252,0.45); }
  .btn-ghost { background: var(--card); border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  /* === QUIZ SECTION === */
  .quiz-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.7rem;
  }
  .progress-info { font-size: 0.85rem; color: var(--muted); }
  .progress-bar-wrap { width: 100%; height: 4px; background: var(--border); border-radius: 99px; margin-bottom: 1.5rem; }
  .progress-bar { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.4s ease; }

  /* === QUESTION CARD === */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    margin-bottom: 1.5rem;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .q-meta { display: flex; gap: 0.7rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
  .q-unit-badge {
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
    padding: 0.2rem 0.7rem; border-radius: 999px;
    background: rgba(192,132,252,0.15); color: var(--accent); border: 1px solid rgba(192,132,252,0.25);
  }
  .q-type-badge {
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
    padding: 0.2rem 0.7rem; border-radius: 999px;
    background: rgba(56,189,248,0.12); color: var(--accent3); border: 1px solid rgba(56,189,248,0.2);
  }
  .q-text {
    font-family: 'DM Serif Display', serif;
    font-size: 1.2rem; line-height: 1.5;
    color: var(--text);
    margin-bottom: 1.5rem;
  }

  /* === OPTIONS === */
  .options { display: flex; flex-direction: column; gap: 0.7rem; }
  .option {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; gap: 1rem;
    transition: all 0.2s;
    font-size: 0.95rem;
    color: var(--text);
  }
  .option:hover:not(.disabled) { border-color: var(--accent); background: rgba(192,132,252,0.08); }
  .option.selected { border-color: var(--accent); background: rgba(192,132,252,0.12); }
  .option.correct { border-color: var(--correct); background: rgba(74,222,128,0.1); color: var(--correct); }
  .option.wrong { border-color: var(--wrong); background: rgba(248,113,113,0.1); color: var(--wrong); }
  .option.disabled { cursor: default; }
  .opt-letter {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem; font-weight: 700; flex-shrink: 0;
    transition: all 0.2s;
  }
  .option.selected .opt-letter { background: var(--accent); color: #fff; }
  .option.correct .opt-letter { background: var(--correct); color: #000; }
  .option.wrong .opt-letter { background: var(--wrong); color: #fff; }

  /* === TRUE/FALSE === */
  .tf-options { display: flex; gap: 1rem; }
  .tf-btn {
    flex: 1; padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 1rem; font-weight: 600; color: var(--text);
    transition: all 0.2s;
  }
  .tf-btn:hover:not(.disabled) { border-color: var(--accent); }
  .tf-btn.selected { border-color: var(--accent); background: rgba(192,132,252,0.12); color: var(--accent); }
  .tf-btn.correct { border-color: var(--correct); background: rgba(74,222,128,0.12); color: var(--correct); }
  .tf-btn.wrong { border-color: var(--wrong); background: rgba(248,113,113,0.1); color: var(--wrong); }

  /* === FILL BLANK === */
  .fill-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.9rem 1.2rem;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    transition: border-color 0.2s;
  }
  .fill-input:focus { outline: none; border-color: var(--accent); }
  .fill-input.correct { border-color: var(--correct); color: var(--correct); }
  .fill-input.wrong { border-color: var(--wrong); color: var(--wrong); }

  /* === FEEDBACK === */
  .feedback {
    margin-top: 1rem; padding: 1rem 1.2rem;
    border-radius: 10px; font-size: 0.9rem; line-height: 1.5;
    display: none;
    animation: fadeUp 0.2s ease;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: var(--correct); }
  .feedback.wrong-fb { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25); color: #fca5a5; }
  .feedback strong { display: block; margin-bottom: 0.3rem; }

  /* === QUIZ NAV === */
  .quiz-nav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }

  /* === SCORE SCREEN === */
  .score-screen {
    text-align: center; padding: 3rem 1.5rem;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius);
    animation: fadeUp 0.4s ease;
  }
  .score-ring {
    width: 140px; height: 140px;
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    background: var(--surface);
    border: 3px solid var(--border);
  }
  .score-ring::before {
    content: '';
    position: absolute; inset: -3px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) var(--pct, 0%), var(--border) var(--pct, 0%));
    z-index: -1;
  }
  .score-num { font-family: 'DM Serif Display', serif; font-size: 2.5rem; line-height: 1; }
  .score-label { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .score-title { font-family: 'DM Serif Display', serif; font-size: 1.8rem; margin-bottom: 0.5rem; }
  .score-sub { color: var(--muted); margin-bottom: 2rem; }
  .score-breakdown { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
  .score-stat { text-align: center; }
  .score-stat .val { font-size: 1.5rem; font-weight: 700; }
  .score-stat .val.c { color: var(--correct); }
  .score-stat .val.w { color: var(--wrong); }
  .score-stat .lbl { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }

  /* === FLASHCARDS === */
  .flashcard-wrap { perspective: 1200px; }
  .flashcard {
    width: 100%; min-height: 260px;
    position: relative; cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
    margin-bottom: 1.5rem;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .fc-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2.5rem;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; text-align: center;
  }
  .fc-back { transform: rotateY(180deg); background: var(--surface); border-color: var(--accent); }
  .fc-hint { font-size: 0.75rem; color: var(--muted); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .fc-content { font-family: 'DM Serif Display', serif; font-size: 1.15rem; line-height: 1.55; }
  .fc-back .fc-content { color: var(--accent); font-size: 1rem; }
  .fc-nav { display: flex; align-items: center; justify-content: center; gap: 1.5rem; }
  .fc-counter { font-size: 0.9rem; color: var(--muted); }

  /* === GLOSSARY === */
  .glossary-grid { display: flex; flex-direction: column; gap: 1rem; }
  .gloss-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.2rem 1.5rem;
    cursor: pointer; transition: all 0.2s;
  }
  .gloss-item:hover { border-color: var(--accent); }
  .gloss-term { font-family: 'DM Serif Display', serif; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: center; }
  .gloss-unit { font-size: 0.72rem; color: var(--accent); font-family: 'DM Sans', sans-serif; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .gloss-def { margin-top: 0.7rem; font-size: 0.9rem; line-height: 1.55; color: #b8afd4; display: none; }
  .gloss-def.open { display: block; animation: fadeUp 0.2s ease; }
  .gloss-arrow { transition: transform 0.2s; color: var(--muted); }
  .gloss-item.open .gloss-arrow { transform: rotate(180deg); }

  /* === STUDY NOTES === */
  .notes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.2rem; }
  .note-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.5rem;
    border-top: 3px solid var(--accent);
  }
  .note-card:nth-child(2) { border-top-color: var(--accent2); }
  .note-card:nth-child(3) { border-top-color: var(--accent3); }
  .note-card:nth-child(4) { border-top-color: var(--gold); }
  .note-head { font-family: 'DM Serif Display', serif; font-size: 1.05rem; margin-bottom: 0.7rem; }
  .note-body { font-size: 0.88rem; line-height: 1.7; color: #b8afd4; }
  .note-body li { margin-left: 1rem; margin-bottom: 0.4rem; }

  /* === EMPTY STATE === */
  .empty { text-align: center; padding: 3rem; color: var(--muted); }
  .empty-icon { font-size: 3rem; margin-bottom: 1rem; }

  /* === RESPONSIVE === */
  @media (max-width: 600px) {
    .q-card { padding: 1.3rem; }
    .controls { flex-direction: column; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="badge">🎓 BPC 006 · Block 3</div>
    <h1>Development During Adolescence</h1>
    <p class="subtitle">Interactive Quiz Builder · Units 1–4</p>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="showTab('quiz')">📝 Quiz</button>
    <button class="tab" onclick="showTab('flashcards')">🃏 Flashcards</button>
    <button class="tab" onclick="showTab('glossary')">📖 Glossary</button>
    <button class="tab" onclick="showTab('notes')">🗒️ Study Notes</button>
  </div>

  <!-- ====== QUIZ TAB ====== -->
  <div id="tab-quiz">
    <div id="quiz-setup">
      <div class="unit-grid" id="unitGrid"></div>
      <div class="controls">
        <div class="control-group">
          <label>Question Type</label>
          <select id="qtype">
            <option value="all">All Types</option>
            <option value="mcq">Multiple Choice</option>
            <option value="tf">True / False</option>
            <option value="fill">Fill in the Blank</option>
          </select>
        </div>
        <div class="control-group">
          <label>Number of Questions</label>
          <input type="number" id="qcount" value="10" min="3" max="30">
        </div>
        <div class="control-group" style="justify-content: flex-end;">
          <label>&nbsp;</label>
          <button class="btn btn-primary" onclick="startQuiz()">▶ Start Quiz</button>
        </div>
      </div>
    </div>

    <div id="quiz-active" style="display:none;">
      <div class="quiz-header">
        <div class="progress-info" id="progressInfo"></div>
        <div style="display:flex;gap:0.7rem;">
          <span id="scoreDisplay" style="font-size:0.85rem;color:var(--muted);"></span>
          <button class="btn btn-ghost" style="padding:0.4rem 0.9rem;font-size:0.8rem;" onclick="endQuiz()">✕ End Quiz</button>
        </div>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div id="questionArea"></div>
      <div class="quiz-nav">
        <div></div>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
      </div>
    </div>

    <div id="quiz-score" style="display:none;"></div>
  </div>

  <!-- ====== FLASHCARDS TAB ====== -->
  <div id="tab-flashcards" style="display:none;">
    <div style="display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:flex-end;">
      <div class="control-group" style="flex:1;min-width:160px;">
        <label>Filter by Unit</label>
        <select id="fcUnit" onchange="loadFlashcards()">
          <option value="all">All Units</option>
          <option value="1">Unit 1 – Physical Changes</option>
          <option value="2">Unit 2 – Cognitive Changes</option>
          <option value="3">Unit 3 – Identity & Self</option>
          <option value="4">Unit 4 – Challenges</option>
        </select>
      </div>
      <button class="btn btn-ghost" onclick="shuffleCards()">🔀 Shuffle</button>
    </div>
    <div class="flashcard-wrap">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="fc-face">
          <div class="fc-hint">Click to reveal answer</div>
          <div class="fc-content" id="fcFront"></div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-hint">Answer</div>
          <div class="fc-content" id="fcBack"></div>
        </div>
      </div>
    </div>
    <div class="fc-nav">
      <button class="btn btn-ghost" onclick="fcNav(-1)">← Prev</button>
      <span class="fc-counter" id="fcCounter"></span>
      <button class="btn btn-ghost" onclick="fcNav(1)">Next →</button>
    </div>
  </div>

  <!-- ====== GLOSSARY TAB ====== -->
  <div id="tab-glossary" style="display:none;">
    <div style="margin-bottom:1.2rem;">
      <input type="text" placeholder="🔍  Search terms..." id="glossSearch" oninput="filterGlossary()"
        style="width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:0.75rem 1.1rem;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.95rem;">
    </div>
    <div class="glossary-grid" id="glossaryGrid"></div>
  </div>

  <!-- ====== NOTES TAB ====== -->
  <div id="tab-notes" style="display:none;">
    <div class="notes-grid" id="notesGrid"></div>
  </div>

</div>

<script>
// ============================================================
//  DATA
// ============================================================

const UNITS = [
  { id: 1, title: "Physical Changes", topics: ["Puberty", "Growth Spurt", "Male/Female Changes"] },
  { id: 2, title: "Cognitive Changes", topics: ["Piaget's Stages", "Information Processing", "School Performance"] },
  { id: 3, title: "Identity & Self Concept", topics: ["Identity Crisis", "Marcia's Statuses", "Self-Esteem"] },
  { id: 4, title: "Challenges & Issues", topics: ["High-Risk Behaviour", "Sexuality", "Loss of Normalcy"] },
];

const ALL_QUESTIONS = [
  // ---- UNIT 1 ----
  { unit:1, type:'mcq', q:"Adolescence generally extends from which age range?", opts:["8–14 years","12–19 years","10–18 years","15–21 years"], ans:1, exp:"Adolescence is broadly defined as the period from 12 to 19 years of age, categorised into early, middle, and late stages." },
  { unit:1, type:'mcq', q:"Which hormone triggers sperm development in boys during puberty?", opts:["Estrogen","Testosterone","FSH","Progesterone"], ans:2, exp:"FSH (follicle-stimulating hormone) secreted by the pituitary gland causes sperm to develop in boys." },
  { unit:1, type:'mcq', q:"At what age does puberty typically begin in girls?", opts:["12–14 years","14–16 years","8–13 years","10–15 years"], ans:2, exp:"Puberty in girls usually begins between 8 and 13 years of age, typically about a year earlier than boys." },
  { unit:1, type:'tf', q:"Late adolescents (17–19 years) show greater concern for others compared to earlier stages.", ans:true, exp:"Late adolescents develop greater emotional stability, become more self-reliant, and show increased concern for others." },

// ============================================================
//  STATE
// ============================================================
let selectedUnits = [1,2,3,4];
let quizQuestions = [];
let currentQ = 0;
let score = 0;
let answered = false;
let fcIndex = 0;
let fcDeck = [];

// ============================================================
//  INIT
// ============================================================
window.onload = () => {
  buildUnitGrid();
  loadFlashcards();
  renderGlossary();
  renderNotes();
};

function buildUnitGrid() {
  const grid = document.getElementById('unitGrid');
  grid.innerHTML = UNITS.map(u => {
    const count = ALL_QUESTIONS.filter(q => q.unit === u.id).length;
    return `<div class="unit-card selected" id="uc${u.id}" onclick="toggleUnit(${u.id})">
      <div class="unit-num">Unit ${u.id}</div>
      <div class="unit-title">${u.title}</div>
      <div class="unit-count">${count} questions</div>
    </div>`;
  }).join('');
}

function toggleUnit(id) {
  const idx = selectedUnits.indexOf(id);
  if (idx > -1) {
    if (selectedUnits.length === 1) return; // keep at least one
    selectedUnits.splice(idx, 1);
  } else {
    selectedUnits.push(id);
  }
  document.getElementById('uc'+id).classList.toggle('selected');
}

// ============================================================
//  QUIZ
// ============================================================
function startQuiz() {
  const type = document.getElementById('qtype').value;
  const count = Math.min(parseInt(document.getElementById('qcount').value)||10, 30);

  let pool = ALL_QUESTIONS.filter(q => selectedUnits.includes(q.unit));
  if (type !== 'all') pool = pool.filter(q => q.type === type);
  if (!pool.length) { alert('No questions match your selection. Try different filters.'); return; }

  // shuffle
  pool = pool.sort(() => Math.random() - 0.5).slice(0, count);
  quizQuestions = pool;
  currentQ = 0; score = 0; answered = false;

  document.getElementById('quiz-setup').style.display = 'none';
  document.getElementById('quiz-active').style.display = 'block';
  document.getElementById('quiz-score').style.display = 'none';
  showQuestion();
}

function showQuestion() {
  answered = false;
  document.getElementById('nextBtn').disabled = true;
  const q = quizQuestions[currentQ];
  const total = quizQuestions.length;
  document.getElementById('progressInfo').textContent = `Question ${currentQ+1} of ${total}`;
  document.getElementById('scoreDisplay').textContent = `✓ ${score} correct`;
  document.getElementById('progressBar').style.width = `${(currentQ/total)*100}%`;

  const UNIT_NAMES = {1:'Unit 1',2:'Unit 2',3:'Unit 3',4:'Unit 4'};
  const TYPE_LABEL = {mcq:'Multiple Choice',tf:'True / False',fill:'Fill in Blank'};

  let optHTML = '';
  if (q.type === 'mcq') {
    optHTML = `<div class="options">${q.opts.map((o,i)=>`
      <div class="option" id="opt${i}" onclick="selectMCQ(${i})">
        <div class="opt-letter">${'ABCD'[i]}</div>${o}
      </div>`).join('')}</div>`;
  } else if (q.type === 'tf') {
    optHTML = `<div class="tf-options">
      <button class="tf-btn" id="optT" onclick="selectTF(true)">✓ True</button>
      <button class="tf-btn" id="optF" onclick="selectTF(false)">✗ False</button>
    </div>`;
  } else {
    optHTML = `<input class="fill-input" id="fillInput" placeholder="Type your answer…" onkeydown="if(event.key==='Enter')checkFill()">
    <button class="btn btn-ghost" style="margin-top:0.7rem;" onclick="checkFill()">Check Answer</button>`;
  }

  document.getElementById('questionArea').innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <span class="q-unit-badge">${UNIT_NAMES[q.unit]}</span>
        <span class="q-type-badge">${TYPE_LABEL[q.type]}</span>
      </div>
      <div class="q-text">${q.q}</div>
      ${optHTML}
      <div class="feedback" id="feedback"></div>
    </div>`;
}

function selectMCQ(i) {
  if (answered) return;
  answered = true;
  const q = quizQuestions[currentQ];
  document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
  const selected = document.getElementById('opt'+i);
  selected.classList.add('selected');
  if (i === q.ans) {
    selected.classList.add('correct');
    score++;
    showFeedback(true, q.exp);
  } else {
    selected.classList.add('wrong');
    document.getElementById('opt'+q.ans).classList.add('correct');
    showFeedback(false, q.exp);
  }
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('scoreDisplay').textContent = `✓ ${score} correct`;
}

function selectTF(val) {
  if (answered) return;
  answered = true;
  const q = quizQuestions[currentQ];
  const btnT = document.getElementById('optT');
  const btnF = document.getElementById('optF');
  btnT.classList.add('disabled'); btnF.classList.add('disabled');
  const chosen = val ? btnT : btnF;
  chosen.classList.add('selected');
  if (val === q.ans) {
    chosen.classList.add('correct');
    score++;
    showFeedback(true, q.exp);
  } else {
    chosen.classList.add('wrong');
    (val ? btnF : btnT).classList.add('correct');
    showFeedback(false, q.exp);
  }
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('scoreDisplay').textContent = `✓ ${score} correct`;
}

function checkFill() {
  if (answered) return;
  const q = quizQuestions[currentQ];
  const input = document.getElementById('fillInput');
  const userAns = input.value.trim().toLowerCase();
  const correct = [q.ans, ...(q.alt||[])].map(a => a.toLowerCase());
  answered = true;
  input.disabled = true;
  if (correct.includes(userAns)) {
    input.classList.add('correct');
    score++;
    showFeedback(true, q.exp);
  } else {
    input.classList.add('wrong');
    showFeedback(false, `Correct answer: <strong>${q.ans}</strong><br>${q.exp}`);
  }
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('scoreDisplay').textContent = `✓ ${score} correct`;
}

function showFeedback(correct, txt) {
  const fb = document.getElementById('feedback');
  fb.innerHTML = `<strong>${correct ? '✓ Correct!' : '✗ Incorrect'}</strong>${txt}`;
  fb.className = `feedback show ${correct ? 'correct-fb' : 'wrong-fb'}`;
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= quizQuestions.length) { showScore(); return; }
  showQuestion();
}

function showScore() {
  document.getElementById('quiz-active').style.display = 'none';
  const pct = Math.round((score/quizQuestions.length)*100);
  const deg = `${pct}%`;
  let msg = pct >= 80 ? "Outstanding! 🎉" : pct >= 60 ? "Good Work! 👍" : "Keep Studying! 📚";
  let sub = pct >= 80 ? "Excellent grasp of adolescent development." : pct >= 60 ? "Solid understanding with room to improve." : "Review the study notes and try again.";
  const scoreEl = document.getElementById('quiz-score');
  scoreEl.style.display = 'block';
  scoreEl.innerHTML = `
    <div class="score-screen">
      <div class="score-ring" style="--pct:${deg}">
        <div class="score-num">${pct}%</div>
        <div class="score-label">Score</div>
      </div>
      <div class="score-title">${msg}</div>
      <p class="score-sub">${sub}</p>
      <div class="score-breakdown">
        <div class="score-stat"><div class="val c">${score}</div><div class="lbl">Correct</div></div>
        <div class="score-stat"><div class="val w">${quizQuestions.length-score}</div><div class="lbl">Incorrect</div></div>
        <div class="score-stat"><div class="val">${quizQuestions.length}</div><div class="lbl">Total</div></div>
      </div>
      <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="restartQuiz()">↺ Try Again</button>
        <button class="btn btn-ghost" onclick="showTab('notes')">🗒️ Study Notes</button>
      </div>
    </div>`;
}

function restartQuiz() {
  document.getElementById('quiz-score').style.display = 'none';
  document.getElementById('quiz-setup').style.display = 'block';
}

function endQuiz() {
  if (!confirm('End the quiz early?')) return;
  document.getElementById('quiz-active').style.display = 'none';
  document.getElementById('quiz-setup').style.display = 'block';
}

// ============================================================
//  FLASHCARDS
// ============================================================
function loadFlashcards() {
  const unit = document.getElementById('fcUnit').value;
  fcDeck = unit === 'all' ? [...FLASHCARDS] : FLASHCARDS.filter(c => c.unit == unit);
  fcIndex = 0;
  document.getElementById('flashcard').classList.remove('flipped');
  renderCard();
}

function shuffleCards() {
  fcDeck = fcDeck.sort(() => Math.random() - 0.5);
  fcIndex = 0;
  document.getElementById('flashcard').classList.remove('flipped');
  renderCard();
}

function renderCard() {
  if (!fcDeck.length) return;
  const c = fcDeck[fcIndex];
  document.getElementById('fcFront').textContent = c.front;
  document.getElementById('fcBack').textContent = c.back;
  document.getElementById('fcCounter').textContent = `${fcIndex+1} / ${fcDeck.length}`;
  document.getElementById('flashcard').classList.remove('flipped');
}

function flipCard() {
  document.getElementById('flashcard').classList.toggle('flipped');
}

function fcNav(dir) {
  fcIndex = (fcIndex + dir + fcDeck.length) % fcDeck.length;
  renderCard();
}

function renderGlossary(filter='') {
  const grid = document.getElementById('glossaryGrid');
  const items = GLOSSARY.filter(g => !filter || g.term.toLowerCase().includes(filter) || g.def.toLowerCase().includes(filter));
  grid.innerHTML = items.map((g,i) => `
    <div class="gloss-item" id="gi${i}" onclick="toggleGloss(${i})">
      <div class="gloss-term">
        <span>${g.term} <span class="gloss-unit">U${g.unit}</span></span>
        <span class="gloss-arrow">▾</span>
      </div>
      <div class="gloss-def" id="gd${i}">${g.def}</div>
    </div>`).join('');
}

function toggleGloss(i) {
  const item = document.getElementById('gi'+i);
  const def = document.getElementById('gd'+i);
  item.classList.toggle('open');
  def.classList.toggle('open');
}

function filterGlossary() {
  renderGlossary(document.getElementById('glossSearch').value.toLowerCase());
}

// ============================================================
//  NOTES
// ============================================================
function renderNotes() {
  document.getElementById('notesGrid').innerHTML = STUDY_NOTES.map(n => `
    <div class="note-card" style="border-top-color:${n.color}">
      <div class="note-head">${n.title}</div>
      <div class="note-body"><ul>${n.points.map(p=>`<li>${p}</li>`).join('')}</ul></div>
    </div>`).join('');
}

// ============================================================
//  TABS
// ============================================================
function showTab(name) {
  ['quiz','flashcards','glossary','notes'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===name ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach((btn,i) => {
    btn.classList.toggle('active', ['quiz','flashcards','glossary','notes'][i] === name);
  });
}
</script>
</body>
</html>
