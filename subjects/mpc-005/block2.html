<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Methods Learning Builder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-background-primary: #ffffff;
            --color-background-secondary: #f5f5f5;
            --color-background-tertiary: #eeeeee;
            --color-text-primary: #1a1a1a;
            --color-text-secondary: #666666;
            --color-text-tertiary: #999999;
            --color-border-primary: #cccccc;
            --color-border-secondary: #dddddd;
            --color-border-tertiary: #eeeeee;
            --color-info: #0066cc;
            --color-success: #28a745;
            --color-warning: #ffc107;
            --color-danger: #dc3545;
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-background-primary: #1e1e1e;
                --color-background-secondary: #2d2d2d;
                --color-background-tertiary: #3a3a3a;
                --color-text-primary: #f0f0f0;
                --color-text-secondary: #b0b0b0;
                --color-text-tertiary: #808080;
                --color-border-primary: #444444;
                --color-border-secondary: #333333;
                --color-border-tertiary: #2a2a2a;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--color-background-tertiary);
            color: var(--color-text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            margin-bottom: 3rem;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--color-text-primary);
        }

        .header p {
            font-size: 16px;
            color: var(--color-text-secondary);
        }

        .blocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 3rem;
        }

        .block-card {
            background: var(--color-background-primary);
            border: 2px solid var(--color-border-secondary);
            border-radius: var(--border-radius-lg);
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .block-card:hover {
            border-color: var(--color-info);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.1);
        }

        .block-card.active {
            border-color: var(--color-info);
            background: linear-gradient(135deg, rgba(0, 102, 204, 0.05), rgba(0, 102, 204, 0.02));
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.15);
        }

        .block-num {
            font-size: 48px;
            font-weight: 700;
            color: var(--color-info);
            margin-bottom: 0.5rem;
        }

        .block-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .units-container {
            margin-bottom: 3rem;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .units-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--color-background-secondary);
            border-radius: var(--border-radius-lg);
        }

        .units-header h2 {
            font-size: 22px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .close-btn {
            background: var(--color-background-primary);
            border: 1px solid var(--color-border-secondary);
            padding: 8px 16px;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            font-size: 14px;
            color: var(--color-text-secondary);
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: var(--color-background-tertiary);
            border-color: var(--color-border-primary);
        }

        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .unit-card {
            background: var(--color-background-primary);
            border: 1px solid var(--color-border-secondary);
            border-radius: var(--border-radius-md);
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .unit-card:hover {
            border-color: var(--color-info);
            background: var(--color-background-secondary);
        }

        .unit-card.active {
            border: 2px solid var(--color-info);
            background: linear-gradient(135deg, rgba(0, 102, 204, 0.05), rgba(0, 102, 204, 0.02));
        }

        .unit-num {
            font-size: 13px;
            color: var(--color-text-secondary);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .unit-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .content-panel {
            background: var(--color-background-primary);
            border-radius: var(--border-radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--color-border-secondary);
            animation: slideDown 0.3s ease;
        }

        .content-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--color-border-secondary);
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
        }

        .content-header h3 {
            font-size: 24px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin: 0;
        }

        .concepts-list {
            display: grid;
            gap: 16px;
            margin-bottom: 2rem;
        }

        .concept-item {
            background: var(--color-background-secondary);
            border: 1px solid var(--color-border-secondary);
            border-radius: var(--border-radius-md);
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .concept-item:hover {
            border-color: var(--color-info);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .concept-item.expanded {
            border-color: var(--color-info);
            background: var(--color-background-primary);
            box-shadow: 0 2px 8px rgba(0, 102, 204, 0.15);
        }

        .concept-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .concept-badge {
            font-size: 12px;
            background: var(--color-background-tertiary);
            color: var(--color-text-secondary);
            padding: 4px 10px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .concept-description {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin: 0;
        }

        .concept-details {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--color-border-secondary);
            display: none;
        }

        .concept-details.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .detail-section {
            margin-bottom: 1.5rem;
        }

        .detail-section h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.5rem;
        }

        .detail-content {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin: 0;
            line-height: 1.6;
        }

        .key-points {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .key-points li {
            padding-left: 20px;
            margin-bottom: 0.75rem;
            position: relative;
            font-size: 13px;
            color: var(--color-text-secondary);
        }

        .key-points li:before {
            content: "▸";
            position: absolute;
            left: 0;
            color: var(--color-info);
            font-weight: bold;
        }

        .analysis-tools {
            display: flex;
            gap: 10px;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: transparent;
            border: 1px solid var(--color-border-secondary);
            padding: 8px 14px;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            font-size: 12px;
            color: var(--color-text-secondary);
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: var(--color-background-tertiary);
            border-color: var(--color-info);
            color: var(--color-info);
        }

        .mindmap {
            background: var(--color-background-tertiary);
            border: 1px solid var(--color-border-secondary);
            border-radius: var(--border-radius-md);
            padding: 1rem;
            margin: 1rem 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .mindmap-node {
            padding: 0.5rem;
            margin: 0.25rem 0;
            background: var(--color-background-primary);
            border-left: 3px solid var(--color-info);
            padding-left: 1rem;
            font-size: 13px;
            color: var(--color-text-primary);
            border-radius: 4px;
        }

        .mindmap-node.sub {
            margin-left: 1rem;
            background: transparent;
            border-left: 2px solid var(--color-border-secondary);
            color: var(--color-text-secondary);
        }

        .mindmap-node.subsub {
            margin-left: 2rem;
            font-size: 12px;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-top: 2rem;
            flex-wrap: wrap;
            border-top: 1px solid var(--color-border-secondary);
            padding-top: 2rem;
        }

        .action-btn {
            background: var(--color-background-primary);
            border: 1px solid var(--color-border-secondary);
            padding: 12px 18px;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            font-size: 14px;
            color: var(--color-text-primary);
            transition: all 0.2s;
            font-weight: 500;
        }

        .action-btn:hover {
            background: var(--color-background-secondary);
            border-color: var(--color-border-primary);
        }

        .action-btn.primary {
            background: var(--color-info);
            border-color: var(--color-info);
            color: white;
        }

        .action-btn.primary:hover {
            background: #0052a3;
            border-color: #0052a3;
        }

        .hidden {
            display: none !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--color-background-primary);
            border-radius: var(--border-radius-lg);
            padding: 2rem;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 1rem;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--color-text-secondary);
        }

        .modal-content {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.7;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header h1 {
                font-size: 24px;
            }

            .blocks-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .units-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .action-bar {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Research Methods Learning Builder</h1>
            <p>Interactive exploration of Survey, Ex-Post Facto, Experimental, and Case Study Research</p>
        </div>

        <div class="blocks-grid" id="blocksGrid"></div>

        <div id="unitsContainer" class="units-container hidden">
            <div class="units-header">
                <h2 id="blockTitle"></h2>
                <button class="close-btn" onclick="closeUnits()">← Back</button>
            </div>
            <div class="units-grid" id="unitsGrid"></div>
        </div>

        <div id="contentPanel" class="content-panel hidden">
            <div class="content-header">
                <p class="breadcrumb" id="breadcrumb"></p>
                <h3 id="unitTitle"></h3>
            </div>
            <div id="conceptsList" class="concepts-list"></div>
            <div class="action-bar">
                <button class="action-btn primary" onclick="downloadStudyGuide()">📥 Download Study Guide</button>
                <button class="action-btn" onclick="showModal('quiz')">❓ Generate Quiz</button>
                <button class="action-btn" onclick="showModal('flashcards')">🎴 Create Flashcards</button>
                <button class="action-btn" onclick="exportAsMarkdown()">📄 Export as Markdown</button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const researchData = {
            blocks: [
                {
                    id: 1,
                    num: 1,
                    title: "Survey Research",
                    units: [
                        {
                            id: 1,
                            num: 1,
                            title: "Survey Research",
                            concepts: [
                                {
                                    title: "Concept and Meaning",
                                    desc: "Non-experimental descriptive method for studying large samples",
                                    details: {
                                        definition: "Collection of data through standardized questionnaires or interviews from a sample of respondents",
                                        methods: ["Direct observation", "Indirect observation"],
                                        keyPoints: ["Quantitative method", "Applied social research", "Face-to-face or indirect data collection"]
                                    }
                                },
                                {
                                    title: "7 Steps in Conducting Survey",
                                    desc: "Systematic process from planning to communication",
                                    details: {
                                        steps: ["Determine aims and objectives", "Define population", "Design and construct survey", "Select representative sample", "Administer survey", "Analyze and interpret findings", "Communicate findings"],
                                        keyPoints: ["Each step is sequential", "Pilot study ensures instrument validity"]
                                    }
                                },
                                {
                                    title: "Methods/Instruments",
                                    desc: "Tools for collecting data",
                                    details: {
                                        instruments: ["Sampling (randomization, stratification)", "Questionnaires (mail, group, drop-off)", "Interviews (structured, unstructured, telephonic)"],
                                        keyPoints: ["Questionnaires: cost-effective", "Interviews: more detailed responses", "Sampling: ensures representation"]
                                    }
                                },
                                {
                                    title: "Types of Survey",
                                    desc: "Cross-sectional and longitudinal approaches",
                                    details: {
                                        types: ["Cross-sectional: data from varied groups at single time", "Longitudinal: same sample over longer period"],
                                        subtypes: ["Trend studies", "Cohort studies", "Panel studies"],
                                        keyPoints: ["Cross-sectional: less time, economical", "Longitudinal: captures behavioral changes"]
                                    }
                                },
                                {
                                    title: "Constructing Survey Research",
                                    desc: "Framework for instruments and data collection",
                                    details: {
                                        aspects: ["Content, scope, objectives", "Format of response", "Question framing", "Question series formatting", "Ethical consideration"],
                                        keyPoints: ["Questions should be short and specific", "Clarity essential for good responses"]
                                    }
                                },
                                {
                                    title: "Types of Questions",
                                    desc: "Structured and unstructured question formats",
                                    details: {
                                        structured: ["Dichotomous (yes/no)", "Level of measurement based", "Filter/Contingency questions"],
                                        unstructured: ["Open-ended", "Informal atmosphere", "Interviewer-led"],
                                        keyPoints: ["Structured: predetermined format", "Unstructured: flexible, probe-based"]
                                    }
                                }
                            ]
                        }
                    ]
                },
                {
                    id: 2,
                    num: 2,
                    title: "Ex-Post Facto Research",
                    units: [
                        {
                            id: 2,
                            num: 2,
                            title: "Ex-Post Facto Research",
                            concepts: [
                                {
                                    title: "Concept and Meaning",
                                    desc: "Causal-comparative research analyzing existing effects",
                                    details: {
                                        definition: "Empirical investigation predicting possible causes behind already-occurred effects",
                                        characteristics: ["Researcher has no direct control", "Variables already led to effects", "Conclusions inferred without intervention"],
                                        keyPoints: ["Also called causal-comparative", "Effect is fixed, causes predicted"]
                                    }
                                },
                                {
                                    title: "Forms of Research Design",
                                    desc: "Prospective and retrospective approaches",
                                    details: {
                                        prospective: "Finding future results after treating independent variable",
                                        retrospective: "Tracing history to find causes of occurred events",
                                        keyPoints: ["Prospective: future-oriented", "Retrospective: backward-looking"]
                                    }
                                },
                                {
                                    title: "Characteristics",
                                    desc: "Key features of ex-post facto research",
                                    details: {
                                        features: ["Has control/comparison group", "Behavior/treatment cannot be manipulated", "Focuses on effects", "Analyzes how and what aspects", "Explores possible effects and causes"],
                                        keyPoints: ["Dependent variable is fixed", "Independent variable not manipulated"]
                                    }
                                },
                                {
                                    title: "Differences from Experimental",
                                    desc: "How ex-post facto differs from experimental research",
                                    details: {
                                        differences: ["No direct manipulation of variables", "Cannot use randomization principle", "Interpretation is more difficult", "Multiple possible causes for one effect"],
                                        keyPoints: ["Experimental: direct control", "Ex-post facto: inferential"]
                                    }
                                },
                                {
                                    title: "Essentials for Causal Inference",
                                    desc: "Requirements for inferring cause-effect relationships",
                                    details: {
                                        essentials: ["Associative variation: x affects y", "Systematic order of events: x precedes y", "Absence of other causes: best single cause identified"],
                                        keyPoints: ["Covariation necessary", "Temporal precedence required"]
                                    }
                                },
                                {
                                    title: "6 Steps of Ex-Post Facto",
                                    desc: "Systematic process from problem to interpretation",
                                    details: {
                                        steps: ["Determine the problem", "Literature review", "Formulation of hypothesis", "Design the approach", "Validate the research", "Interpret conclusions"],
                                        keyPoints: ["Hypothesis guides cause prediction"]
                                    }
                                }
                            ]
                        }
                    ]
                },
                {
                    id: 3,
                    num: 3,
                    title: "Experimental Research",
                    units: [
                        {
                            id: 3,
                            num: 3,
                            title: "Experimental Research",
                            concepts: [
                                {
                                    title: "Experimental Research Definition",
                                    desc: "Systematic manipulation of variables in controlled conditions",
                                    details: {
                                        definition: "Researcher manipulates one or more variables and controls others",
                                        characteristics: ["Two variables: independent and dependent", "Independent variable manipulated", "Extraneous factors controlled", "Causal processes understood"],
                                        keyPoints: ["Lab-based", "Highest control possible"]
                                    }
                                },
                                {
                                    title: "Field Experiments",
                                    desc: "Real-life situation experiments with less control",
                                    details: {
                                        definition: "Experiments conducted in natural settings like schools",
                                        conditions: ["No absolute control of extraneous factors", "Two matched groups used", "Experimental vs control groups compared"],
                                        keyPoints: ["More realistic than lab", "Some confounding variables remain"]
                                    }
                                },
                                {
                                    title: "Differences: Experimental vs Field",
                                    desc: "Key contrasts between lab and field experiments",
                                    details: {
                                        experimental: ["Homogeneous subjects", "Controlled conditions", "Pure effects studied", "High accuracy predictions"],
                                        field: ["Variable subjects", "Natural settings", "Moderate accuracy", "Both qualitative and quantitative"]
                                    }
                                },
                                {
                                    title: "Research Design Defined",
                                    desc: "Plan, structure, and strategy of investigation",
                                    details: {
                                        components: ["Plan: overall scheme/programme", "Structure: outline and paradigm", "Strategy: method of data collection/analysis"],
                                        keyPoints: ["Blueprint for research", "Provides forecast/solutions"]
                                    }
                                },
                                {
                                    title: "Design Objectives",
                                    desc: "Two basic goals of research design",
                                    details: {
                                        objectives: ["Provide answers to research questions", "Control variance under study"],
                                        principles: ["Maximize systematic variance", "Control extraneous variance", "Minimize error variance"],
                                        keyPoints: ["Variance control critical"]
                                    }
                                },
                                {
                                    title: "Types of Experimental Design",
                                    desc: "Single case, quasi-experimental, and full experimental",
                                    details: {
                                        types: ["Single case: clinical research, behavior modification", "Quasi-experimental: no full random assignment", "Experimental: full control, randomization"],
                                        subtypes: ["Between subjects", "Within subjects", "Mixed", "Factorial"],
                                        keyPoints: ["Quasi-experimental: real-world applicable"]
                                    }
                                }
                            ]
                        }
                    ]
                },
                {
                    id: 4,
                    num: 4,
                    title: "Case Study Research",
                    units: [
                        {
                            id: 4,
                            num: 4,
                            title: "Case Study Research",
                            concepts: [
                                {
                                    title: "Nature of Case Study",
                                    desc: "In-depth examination of single subject or event",
                                    details: {
                                        definition: "Systematic scientific way of perceiving events, collecting data, analyzing information",
                                        characteristics: ["Single or multiple cases", "Both quantitative and qualitative", "Multiple sources of evidence", "Theory-based propositions"],
                                        keyPoints: ["More exhaustive than survey", "Limited scope but informative"]
                                    }
                                },
                                {
                                    title: "Criteria for Selection",
                                    desc: "Information-oriented sampling approach",
                                    details: {
                                        criteria: ["Critical cases", "Extreme/deviant cases", "Paradigmatic cases"],
                                        principle: "Extreme cases reveal more information than average cases",
                                        keyPoints: ["Not random sampling", "Information-rich cases preferred"]
                                    }
                                },
                                {
                                    title: "Types of Case Study",
                                    desc: "Four main categories of case studies",
                                    details: {
                                        types: ["Illustrative: descriptive, one/two instances", "Exploratory/pilot: precedes large investigation", "Cumulative: aggregate info from multiple sites", "Critical instance: examines unique interest/challenges assertions"],
                                        keyPoints: ["Each serves different research purpose"]
                                    }
                                },
                                {
                                    title: "5 Steps in Case Study",
                                    desc: "Process from status determination to follow-up",
                                    details: {
                                        steps: ["Determine present status through observation", "Identify probable antecedents", "Verify antecedents/hypotheses", "Diagnosis and remedial measures", "Follow-up to assess impact"],
                                        keyPoints: ["Multi-method approach used", "Follow-up proves diagnosis"]
                                    }
                                },
                                {
                                    title: "Ways of Using Case Studies",
                                    desc: "Methods for analyzing and presenting cases",
                                    details: {
                                        ways: ["Written analysis of case study", "Panel of experts discussion", "Analysis of similar case studies", "Cross examination with prepared questions"],
                                        keyPoints: ["Writing provides careful analysis", "Expert panels add external perspective"]
                                    }
                                },
                                {
                                    title: "Misconceptions About Case Study",
                                    desc: "Common misunderstandings clarified",
                                    details: {
                                        misconceptions: ["Cannot generalize from individual case", "Only useful for hypothesis generation", "Prone to verification bias", "Difficult to summarize for theory building"],
                                        keyPoints: ["Case studies can contribute to science", "Valid for both generation and testing"]
                                    }
                                }
                            ]
                        }
                    ]
                }
            ]
        };

        let selectedBlock = null;
        let selectedUnit = null;
        let selectedConcept = null;

        function initBlocks() {
            const grid = document.getElementById('blocksGrid');
            researchData.blocks.forEach(block => {
                const card = document.createElement('div');
                card.className = 'block-card';
                card.innerHTML = `
                    <div class="block-num">${block.num}</div>
                    <h3 class="block-title">${block.title}</h3>
                `;
                card.onclick = () => selectBlock(block.id);
                grid.appendChild(card);
            });
        }

        function selectBlock(blockId) {
            selectedBlock = researchData.blocks.find(b => b.id === blockId);
            selectedUnit = null;
            selectedConcept = null;

            document.querySelectorAll('.block-card').forEach((card, idx) => {
                card.classList.toggle('active', researchData.blocks[idx].id === blockId);
            });

            document.getElementById('unitsContainer').classList.remove('hidden');
            document.getElementById('contentPanel').classList.add('hidden');
            document.getElementById('blockTitle').textContent = `${selectedBlock.title} - Units`;

            const grid = document.getElementById('unitsGrid');
            grid.innerHTML = '';
            selectedBlock.units.forEach(unit => {
                const card = document.createElement('div');
                card.className = 'unit-card';
                card.innerHTML = `
                    <div class="unit-num">Unit ${unit.num}</div>
                    <div class="unit-title">${unit.title}</div>
                `;
                card.onclick = (e) => {
                    selectUnit(unit.id);
                    document.querySelectorAll('.unit-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                };
                grid.appendChild(card);
            });
        }

        function selectUnit(unitId) {
            selectedUnit = selectedBlock.units.find(u => u.id === unitId);
            selectedConcept = null;

            document.getElementById('contentPanel').classList.remove('hidden');
            document.getElementById('unitTitle').textContent = selectedUnit.title;
            document.getElementById('breadcrumb').textContent = `${selectedBlock.title} > Unit ${selectedUnit.num}`;

            const list = document.getElementById('conceptsList');
            list.innerHTML = '';
            selectedUnit.concepts.forEach((concept, idx) => {
                const item = document.createElement('div');
                item.className = 'concept-item';
                item.innerHTML = `
                    <div class="concept-title">
                        <span>${concept.title}</span>
                        <span class="concept-badge">${idx + 1}/${selectedUnit.concepts.length}</span>
                    </div>
                    <p class="concept-description">${concept.desc}</p>
                    <div class="concept-details" id="details-${idx}">
                        ${generateConceptDetails(concept.details)}
                        <div class="analysis-tools">
                            <button class="tool-btn" onclick="showMindmap(${idx})">🧠 Mind Map</button>
                            <button class="tool-btn" onclick="showSummary(${idx})">📝 Summary</button>
                            <button class="tool-btn" onclick="copyToClipboard(${idx})">📋 Copy Text</button>
                        </div>
                    </div>
                `;
                item.onclick = () => toggleConcept(idx, item);
                list.appendChild(item);
            });
        }

        function generateConceptDetails(details) {
            let html = '';
            for (const [key, value] of Object.entries(details)) {
                const label = key.split(/(?=[A-Z])/).join(' ');
                if (Array.isArray(value)) {
                    html += `<div class="detail-section"><h4>${label}:</h4><ul class="key-points">`;
                    value.forEach(v => html += `<li>${v}</li>`);
                    html += `</ul></div>`;
                } else {
                    html += `<div class="detail-section"><h4>${label}:</h4><p class="detail-content">${value}</p></div>`;
                }
            }
            return html;
        }

        function toggleConcept(idx, elem) {
            const details = document.getElementById(`details-${idx}`);
            elem.classList.toggle('expanded');
            details.classList.toggle('show');
        }

        function showMindmap(idx) {
            const concept = selectedUnit.concepts[idx];
            const mindmapDiv = document.createElement('div');
            mindmapDiv.className = 'mindmap';
            let html = `<div class="mindmap-node"><strong>${concept.title}</strong></div>`;
            const details = concept.details;
            for (const [key, value] of Object.entries(details)) {
                html += `<div class="mindmap-node sub"><strong>${key}</strong></div>`;
                if (Array.isArray(value)) {
                    value.slice(0, 4).forEach(v => html += `<div class="mindmap-node subsub">• ${v}</div>`);
                    if (value.length > 4) html += `<div class="mindmap-node subsub">+ ${value.length - 4} more</div>`;
                }
            }
            mindmapDiv.innerHTML = html;

            const details_elem = document.getElementById(`details-${idx}`);
            const existing = details_elem.querySelector('.mindmap');
            if (existing) {
                existing.remove();
            } else {
                details_elem.appendChild(mindmapDiv);
            }
        }

        function showSummary(idx) {
            const concept = selectedUnit.concepts[idx];
            const summary = `
                <div class="modal-header">${concept.title}</div>
                <div class="modal-content">
                    <p><strong>Description:</strong> ${concept.desc}</p>
                    <p><strong>Key Details:</strong></p>
                    <ul class="key-points">
                        ${Object.entries(concept.details)
                            .map(([k, v]) => `<li><strong>${k}:</strong> ${Array.isArray(v) ? v.join(', ') : v}</li>`)
                            .join('')}
                    </ul>
                </div>
            `;
            document.getElementById('modalContent').innerHTML = summary;
            document.getElementById('modal').classList.add('show');
        }

        function copyToClipboard(idx) {
            const concept = selectedUnit.concepts[idx];
            let text = `${concept.title}\n${concept.desc}\n\n`;
            for (const [key, value] of Object.entries(concept.details)) {
                text += `${key}: `;
                if (Array.isArray(value)) {
                    text += value.join(', ');
                } else {
                    text += value;
                }
                text += '\n';
            }
            navigator.clipboard.writeText(text).then(() => {
                alert('✓ Concept content copied to clipboard!');
            });
        }

        function closeUnits() {
            document.getElementById('unitsContainer').classList.add('hidden');
            document.getElementById('contentPanel').classList.add('hidden');
            selectedUnit = null;
            selectedBlock = null;
        }

        function downloadStudyGuide() {
            if (!selectedUnit) return;
            const content = generateGuideContent();
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${selectedBlock.title}_${selectedUnit.title}_StudyGuide.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function generateGuideContent() {
            let content = `${selectedBlock.title} - ${selectedUnit.title}\n`;
            content += `${'='.repeat(60)}\n\n`;
            selectedUnit.concepts.forEach((concept, idx) => {
                content += `${idx + 1}. ${concept.title}\n`;
                content += `${'-'.repeat(40)}\n`;
                content += `Description: ${concept.desc}\n\n`;
                for (const [key, value] of Object.entries(concept.details)) {
                    if (Array.isArray(value)) {
                        content += `${key}:\n`;
                        value.forEach(v => content += `  • ${v}\n`);
                    } else {
                        content += `${key}: ${value}\n`;
                    }
                }
                content += '\n\n';
            });
            return content;
        }

        function exportAsMarkdown() {
            if (!selectedUnit) return;
            const content = generateMarkdownContent();
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${selectedBlock.title}_${selectedUnit.title}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function generateMarkdownContent() {
            let content = `# ${selectedBlock.title} - ${selectedUnit.title}\n\n`;
            selectedUnit.concepts.forEach((concept, idx) => {
                content += `## ${idx + 1}. ${concept.title}\n\n`;
                content += `**Description:** ${concept.desc}\n\n`;
                for (const [key, value] of Object.entries(concept.details)) {
                    if (Array.isArray(value)) {
                        content += `### ${key}\n`;
                        value.forEach(v => content += `- ${v}\n`);
                    } else {
                        content += `**${key}:** ${value}\n`;
                    }
                }
                content += '\n';
            });
            return content;
        }

        function showModal(type) {
            const modalContent = document.getElementById('modalContent');
            if (type === 'quiz') {
                modalContent.innerHTML = `
                    <div class="modal-header">❓ Generate Quiz</div>
                    <div class="modal-content">
                        <p><strong>Sample Quiz Questions for: ${selectedUnit.title}</strong></p>
                        ${selectedUnit.concepts.slice(0, 3).map((concept, i) => `
                            <p><strong>Question ${i + 1}:</strong> What is ${concept.title}?</p>
                        `).join('')}
                        <p><em>Full quiz generation available - create 5-10 questions per unit</em></p>
                        <button class="action-btn primary" style="margin-top: 1rem; width: 100%;" onclick="downloadQuiz()">📥 Download Full Quiz</button>
                    </div>
                `;
            } else if (type === 'flashcards') {
                modalContent.innerHTML = `
                    <div class="modal-header">🎴 Flashcard Creator</div>
                    <div class="modal-content">
                        <p><strong>Flashcards for: ${selectedUnit.title}</strong></p>
                        <p>Total flashcards: ${selectedUnit.concepts.length} cards</p>
                        <ul class="key-points">
                            ${selectedUnit.concepts.map(c => `<li>${c.title}</li>`).join('')}
                        </ul>
                        <p><em>Use spaced repetition technique for maximum retention</em></p>
                        <button class="action-btn primary" style="margin-top: 1rem; width: 100%;" onclick="downloadFlashcards()">📥 Download Flashcards (CSV)</button>
                    </div>
                `;
            }
            document.getElementById('modal').classList.add('show');
        }

        function downloadQuiz() {
            let content = `Quiz: ${selectedUnit.title}\n`;
            content += `${'='.repeat(50)}\n\n`;
            selectedUnit.concepts.forEach((concept, i) => {
                content += `Q${i + 1}: What is meant by "${concept.title}"?\nAnswer: ${concept.desc}\n\n`;
                content += `Q${i + 2}: Explain the key aspects of ${concept.title}.\nAnswer: `;
                for (const [key, value] of Object.entries(concept.details)) {
                    if (Array.isArray(value)) {
                        content += value.slice(0, 2).join(', ');
                    } else {
                        content += value.substring(0, 100);
                    }
                }
                content += '\n\n';
            });
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${selectedBlock.title}_${selectedUnit.title}_Quiz.txt`;
            a.click();
            URL.revokeObjectURL(url);
            closeModal();
        }

        function downloadFlashcards() {
            let content = `Front,Back\n`;
            selectedUnit.concepts.forEach((concept, i) => {
                content += `"${concept.title}","${concept.desc}"\n`;
            });
            const blob = new Blob([content], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${selectedBlock.title}_${selectedUnit.title}_Flashcards.csv`;
            a.click();
            URL.revokeObjectURL(url);
            closeModal();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initBlocks);
    </script>
</body>
</html>
